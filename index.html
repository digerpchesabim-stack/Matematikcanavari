<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7048e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Matematik Canavarı</title>
<style>
:root{--bg:#f4f1fb;--card:#fff;--text:#1d2433;--muted:#6b7385;--accent:#7048e8;--accent-t:#fff;--ok:#1f9d55;--ok-bg:#d9f3e3;--bad:#d64545;--bad-bg:#fbe0e0;--line:#e0daf0}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#141122;--card:#1e1a30;--text:#eef1f7;--muted:#a49fbb;--accent:#a78bfa;--accent-t:#140f2a;--ok:#4cc784;--ok-bg:#163a27;--bad:#ff7b7b;--bad-bg:#44201f;--line:#2e2847}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));min-height:100vh}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.center{text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;text-align:center}
.hero canvas{width:230px;height:230px;animation:bob 2.4s ease-in-out infinite}
.hero h1{font-size:34px;color:var(--accent)}
.hero .next{max-width:320px;font-size:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.hero canvas{animation:none}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.back{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;font-size:16px}
.title{font-size:18px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.col{display:grid;gap:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:22px 12px;font-size:19px;font-weight:600;text-align:center;width:100%}
.btn:active{transform:scale(.98)}
.btn .big{display:block;font-size:34px;margin-bottom:4px;color:var(--accent)}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.score{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.pill b{display:block;font-size:19px;color:var(--text)}
.pill.main{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.pill.main b{color:var(--accent-t);font-size:24px}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 12px;text-align:center;font-size:clamp(30px,10vw,44px);font-weight:700;margin-bottom:16px;letter-spacing:1px;overflow-wrap:anywhere}
.tag{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
.opt{font-size:26px;padding:18px 8px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.msg{text-align:center;font-weight:600;min-height:28px;margin:14px 0 8px;font-size:17px}
.next{background:var(--accent);color:var(--accent-t);border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:600;width:100%;margin-bottom:12px}
.next[hidden]{display:none}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);border-radius:16px;padding:14px;font-size:17px;font-weight:600;width:100%;margin-bottom:12px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:14px;font-size:17px;margin-bottom:10px}
.card{display:block;width:100%;height:auto;max-width:380px;margin:0 auto 14px;border-radius:18px}
.card.wide{max-width:none;border:1px solid var(--line)}
.timer{text-align:center;font-weight:700;font-size:18px;color:var(--accent);margin-bottom:8px}
.ghost:disabled,.next:disabled{opacity:.5}
.prow{display:flex;gap:8px}.prow .btn{flex:1}
.del{border:1px solid var(--bad);color:var(--bad);background:var(--card);border-radius:16px;padding:0 20px;font-size:22px}
.fmt{text-align:right;margin-bottom:6px}
.mini{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
#ov{position:fixed;inset:0;background:rgba(10,8,25,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#ov.solid{background:var(--bg)}
#ov[hidden]{display:none}
.box{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.box p{font-size:18px;line-height:1.4;margin:0 0 18px}
.box h2{margin:0 0 8px;font-size:28px}
.vert{display:inline-flex;flex-direction:column;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(34px,11vw,52px);line-height:1.2;min-width:3ch}
.vert .r{display:flex;justify-content:flex-end}
.vert .sp{justify-content:space-between;gap:.6em}
.vert .bar{height:4px;background:currentColor;margin:4px 0;border-radius:2px}
.vdiv{display:inline-flex;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(34px,11vw,52px);line-height:1.25}
.vdiv .dd{padding-right:.5em}
.vdiv .dv{border-left:4px solid currentColor;padding-left:.5em;min-width:2.4ch;text-align:left}
.vdiv .dt{border-bottom:4px solid currentColor;padding-bottom:2px}
.vdiv .qq{padding-top:2px}
.sol{color:var(--ok);font-weight:800}
.st{border-collapse:collapse;margin:0 auto 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(30px,10vw,46px);line-height:1.15}
.st td{width:1.1em;text-align:center;padding:0}
.st .an{font-size:.34em;line-height:1.05;height:2.4em;color:var(--accent);vertical-align:bottom;font-weight:700}
.st .hl,.hl{background:rgba(112,72,232,.25);border-radius:6px}
.st .bar{height:4px;background:currentColor;padding:0}
.st .op{color:var(--accent)}
.st .lz{opacity:.35}
.stext{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:19px;line-height:1.45;margin:10px 0 14px;text-align:left}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.pq{font-size:20px;font-weight:600;text-align:left;padding:20px 16px;line-height:1.7;letter-spacing:0}
.pq .qs{display:block;margin-top:8px;font-weight:800}
.nm{color:var(--accent);font-weight:800;font-size:1.1em}
.pans{margin-top:12px;font-weight:800;font-size:22px}
.rcode{font-size:48px;font-weight:800;letter-spacing:8px;color:var(--accent);margin:6px 0}
.rrow{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px;font-size:16px}
.rrow.me{border-color:var(--accent);background:#ede9fe;color:#2a1b6e}
.pod{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px;margin-bottom:8px;font-size:20px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.pod.g1{background:#fde047;color:#2a1b6e;font-size:24px}
.pod .sc{margin-left:auto}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:14px;padding:12px 6px;font-size:16px;font-weight:700}.tabs button.on{background:var(--accent);color:var(--accent-t)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:8px 12px;font-size:15px;font-weight:600}.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.lbx{text-align:center}
.lnk{font-size:13px;word-break:break-all;color:var(--muted);margin:6px 0}
details.pbox summary{cursor:pointer;font-size:17px}
.cdbox{text-align:center;padding-top:25vh;font-size:26px;font-weight:700}
#cdn{font-size:140px;font-weight:800;color:var(--accent)}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:18px;line-height:1.5;margin:10px 0;text-align:left}
.pbox ul,.pbox ol{margin:4px 0 8px 20px;padding:0}
.pbox h3{margin:0 0 8px;font-size:19px}
.pbox p{margin:8px 0 2px}
.tbar{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0 14px}
#tfill{height:100%;width:100%;background:var(--ok);border-radius:8px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ani{background:var(--card);border:2px solid var(--line);border-radius:20px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ani .em{font-size:56px;line-height:1}
.ani .an{font-size:36px;font-weight:800}
.ani.ok{background:var(--ok-bg);border-color:var(--ok)}
.ani.ok .em{animation:hop .5s}
.ani.bad{background:var(--bad-bg);border-color:var(--bad);animation:shk .4s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="ov" hidden></div>
<script>
var OPS={
  add:{name:'Toplama',sym:'+',mode:true},
  sub:{name:'Çıkarma',sym:'−',mode:true},
  mul:{name:'Çarpma',sym:'×',mode:false},
  div:{name:'Bölme',sym:'÷',mode:false}
};
var PTS=10;
var st={screen:'welcome',kind:'o',mix:null,pst:0,op:null,eldeli:null,d:null,q:null,idx:0,score:0,ok:0,bad:0,streak:0,seen:{},picked:null,profile:null,last:null,log:[],acc:0,qStart:null,breakUsed:false,onBreak:false,modal:false,vert:false,tries:0,fix:0,showSol:false,steps:null,sk:0};
var tmr=null;
var app=document.getElementById('app');

/* ---------- depolama (telefonda, internetsiz) ---------- */
function ls(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function profiles(){return ls('mc_profiles',[])}
function records(){return ls('mc_records',[])}
function pad(n){return n<10?'0'+n:''+n}
function fmtDate(d){return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(function(){t.style.opacity=0},2400)}
function catLabel(op,e,d,k,m){if(k==='g')return 'Oyun · Akıldan İşlem · '+(op==='rnd'?'Karışık':OPS[op].name);if(k==='p')return 'Problem · '+(op==='mix'?'Karma · '+(MIXN[m]||'Karma'):OPS[op].name)+' · '+d+' basamaklı';return OPS[op].name+(OPS[op].mode?' · '+(e?'Eldeli':'Eldesiz'):'')+' · '+d+' basamaklı'}

/* ---------- soru üretimi ---------- */
var RNG=null;
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rnd(a,b){return Math.floor((RNG?RNG():Math.random())*(b-a+1))+a}
function num(d){return d===1?rnd(1,9):rnd(Math.pow(10,d-1),Math.pow(10,d)-1)}
function hasCarry(a,b){var c=0,any=false;while(a>0||b>0){var s=a%10+b%10+c;if(s>=10){any=true;c=1}else c=0;a=Math.floor(a/10);b=Math.floor(b/10)}return any}
function hasBorrow(a,b){var br=0,any=false;while(a>0||b>0){var da=a%10-br,db=b%10;if(da<db){any=true;br=1}else br=0;a=Math.floor(a/10);b=Math.floor(b/10)}return any}
function genQuestion(){
  var op=st.op,d=st.d,a,b,i;
  if(op==='add'){for(i=0;i<5000;i++){a=num(d);b=num(d);if(hasCarry(a,b)===st.eldeli)break}return {text:a+' + '+b+' = ?',ans:a+b,a:a,b:b,sym:'+'}}
  if(op==='sub'){for(i=0;i<5000;i++){a=num(d);b=num(d);if(a<b){var t=a;a=b;b=t}if(a!==b&&hasBorrow(a,b)===st.eldeli)break}return {text:a+' − '+b+' = ?',ans:a-b,a:a,b:b,sym:'−'}}
  if(op==='mul'){a=d===1?rnd(2,9):num(d);b=rnd(2,9);return {text:a+' × '+b+' = ?',ans:a*b,a:a,b:b,sym:'×'}}
  b=rnd(2,9);
  var lo=d===1?1:Math.pow(10,d-1),hi=Math.pow(10,d)-1;
  var q=rnd(Math.ceil(lo/b),Math.floor(hi/b));
  return {text:(b*q)+' ÷ '+b+' = ?',ans:q,a:b*q,b:b,sym:'÷'};
}
function choices(ans){
  var set=[ans],deltas=[-10,-1,1,10,-100,100,2,-2,-9,9,11,-11],tries=0;
  while(set.length<4&&tries<200){tries++;var c=ans+deltas[rnd(0,deltas.length-1)];if(c>=0&&set.indexOf(c)<0)set.push(c)}
  var n=1;while(set.length<4){if(set.indexOf(ans+n)<0)set.push(ans+n);n++}
  for(var i=set.length-1;i>0;i--){var j=rnd(0,i),t=set[i];set[i]=set[j];set[j]=t}
  return set;
}
function newQ(){
  var q,i;
  for(i=0;i<60;i++){q=st.kind==='p'?genProblem():genQuestion();if(!st.seen[q.text])break}
  st.seen[q.text]=1;q.opts=st.kind==='p'?choicesK(q.ans,q.extra):choices(q.ans);st.q=q;st.picked=null;st.tries=0;st.showSol=false;st.acc=0;st.qStart=Date.now();
}

/* ---------- problemler ---------- */
var NAMES=['Ali','Ayşe','Mehmet','Zeynep','Emre','Elif','Can','Merve','Ahmet','Selin','Burak','Deniz','Fatma','Hasan','Büşra','Yusuf','Esra','Kerem','Melek','Oğuz'];
var VOW='aeıioöuü';
function nameForms(w){
  var v='e',i,L=w.charAt(w.length-1).toLowerCase();
  for(i=w.length-1;i>=0;i--){if(VOW.indexOf(w.charAt(i).toLowerCase())>=0){v=w.charAt(i).toLowerCase();break}}
  var ve=VOW.indexOf(L)>=0,h4='ei'.indexOf(v)>=0?'i':('aı'.indexOf(v)>=0?'ı':('ou'.indexOf(v)>=0?'u':'ü')),h2='aıou'.indexOf(v)>=0?'a':'e',hard='fstkçşhp'.indexOf(L)>=0;
  return {n:w,g:w+"'"+(ve?'n':'')+h4+'n',d:w+"'"+(ve?'y':'')+h2,b:w+"'"+(hard?'t':'d')+h2+'n'};
}
function IT(n,p,pa,a,pl,v,vm,vs,money){return {n:n,p:p,pa:pa,a:a,pl:pl,v:v,vm:vm,vs:vs,money:!!money}}
function CN(n,l,b,d){return {n:n,l:l,b:b,d:d}}
var ITEMS=[
  [IT('elma','elması','elmasını','elmayı','elmaları','topladı','toplamak','toplaması'),
   IT('bilye','bilyesi','bilyesini','bilyeyi','bilyeleri','kazandı','kazanmak','kazanması'),
   IT('kalem','kalemi','kalemini','kalemi','kalemleri','aldı','almak','alması'),
   IT('ceviz','cevizi','cevizini','cevizi','cevizleri','topladı','toplamak','toplaması'),
   IT('şeker','şekeri','şekerini','şekeri','şekerleri','aldı','almak','alması'),
   IT('balon','balonu','balonunu','balonu','balonları','aldı','almak','alması')],
  [IT('kitap','kitabı','kitabını','kitabı','kitapları','aldı','almak','alması'),
   IT('çıkartma','çıkartması','çıkartmasını','çıkartmayı','çıkartmaları','topladı','toplamak','toplaması'),
   IT('tuğla','tuğlası','tuğlasını','tuğlayı','tuğlaları','aldı','almak','alması'),
   IT('fidan','fidanı','fidanını','fidanı','fidanları','dikti','dikmek','dikmesi'),
   IT('boncuk','boncuğu','boncuğunu','boncuğu','boncukları','aldı','almak','alması'),
   IT('TL',"TL'si","TL'sini","TL'yi",'parayı','biriktirdi','biriktirmek','biriktirmesi',true)],
  [IT('TL',"TL'si","TL'sini","TL'yi",'parayı','biriktirdi','biriktirmek','biriktirmesi',true),
   IT('tuğla','tuğlası','tuğlasını','tuğlayı','tuğlaları','aldı','almak','alması'),
   IT('fidan','fidanı','fidanını','fidanı','fidanları','dikti','dikmek','dikmesi'),
   IT('kitap','kitabı','kitabını','kitabı','kitapları','aldı','almak','alması'),
   IT('kâğıt','kâğıdı','kâğıdını','kâğıdı','kâğıtları','aldı','almak','alması')]
];
var CT1=[CN('kutu','kutuda','kutudan','kutuya'),CN('torba','torbada','torbadan','torbaya'),CN('sepet','sepette','sepetten','sepete'),CN('poşet','poşette','poşetten','poşete'),CN('çanta','çantada','çantadan','çantaya')];
var CT2=[CN('koli','kolide','koliden','koliye'),CN('palet','palette','paletten','palete'),CN('çuval','çuvalda','çuvaldan','çuvala'),CN('sandık','sandıkta','sandıktan','sandığa')];
var CTM=[CN('cüzdan','cüzdanda','cüzdandan','cüzdana'),CN('kumbara','kumbarada','kumbaradan','kumbaraya'),CN('kasa','kasada','kasadan','kasaya')];
var THINGS=[['defter','kalem','oyuncak','balon','şeker'],['defter','kalem','oyuncak','balon','şeker'],['ayakkabı','çanta','mont','oyuncak'],['telefon','bilgisayar','televizyon','buzdolabı']];
var CHEAP=[['defter','defterlerden'],['kalem','kalemlerden'],['balon','balonlardan'],['şeker','şekerlerden'],['bilye','bilyelerden']];
var MIXP=['add-sub','add-mul','add-div','sub-mul','sub-div','mul-div'];
var MIXN={'add-sub':'Toplama + Çıkarma','add-mul':'Toplama + Çarpma','add-div':'Toplama + Bölme','sub-mul':'Çıkarma + Çarpma','sub-div':'Çıkarma + Bölme','mul-div':'Çarpma + Bölme','rnd':'Rastgele'};
var SYMN={'+':'toplama','−':'çıkarma','×':'çarpma','÷':'bölme'};
var HK={add:'“daha”, “toplam” gibi sözler → toplama (+)',sub:'“verdi”, “kaldı”, “alındı” gibi sözler → çıkarma (−)',mul:'“her”, “katı”, “…tanesi” gibi sözler → çarpma (×)',div:'“eşit paylaştırdı”, “eşit olarak” gibi sözler → bölme (÷)'};
var SYMO={add:'+',sub:'−',mul:'×',div:'÷'};
function N(x){return '<b class="nm">'+x+'</b>'}
function pk(L){return L[rnd(0,L.length-1)]}
function pn(d){return d===1?rnd(2,9):num(d)}
function mulOf(k,d){
  var lo=d===1?2:Math.pow(10,d-1),hi=Math.pow(10,d)-1,a=Math.max(2,Math.ceil(lo/k)),b=Math.floor(hi/k);
  if(a>b)return null;return k*rnd(a,b);
}
function stg(sym,a,b){return {sym:sym,a:a,b:b,ans:sym==='+'?a+b:sym==='−'?a-b:sym==='×'?a*b:a/b}}
function pickItem(d){var L=ITEMS[d<=2?0:d===3?1:2];return L[rnd(0,L.length-1)]}
function pickC(it,d){return pk(it.money?CTM:(d<=2?CT1:CT2))}
function pair2(){var i=rnd(0,NAMES.length-1),j;do{j=rnd(0,NAMES.length-1)}while(j===i);return [nameForms(NAMES[i]),nameForms(NAMES[j])]}
function mkQ(s,h,ans,expr,stages,extra){
  var last=s.length-1,html='',i;
  for(i=0;i<s.length;i++)html+=(i===last?'<span class="qs">'+s[i]+'</span>':s[i]+' ');

function isMD(o){return o==='mul'||o==='div'}
function mixNums(o1,o2,d){
  var key=o1+'-'+o2,i,x,b1,b2,s1,s2,r,v;
  for(i=0;i<6000;i++){
    b1=isMD(o1)?rnd(2,9):pn(d);
    x=o1==='div'?mulOf(b1,d):pn(d);
    if(x===null)continue;
    if(o1==='sub'&&x<=b1)continue;
    s1=stg(SYMO[o1],x,b1);r=s1.ans;
    b2=isMD(o2)?rnd(2,9):pn(d);
    if(o2==='sub'&&b2>=r)continue;
    if(o2==='div'&&(r%b2!==0||r<b2||(o1==='mul'&&b2===b1)))continue;
    if(o1==='div'&&o2==='mul'&&(b1<3||b2>=b1))continue;
    s2=stg(SYMO[o2],r,b2);
    if(s2.ans<1||s2.ans>99999||r<2)continue;
    v={x:x,y:isMD(o1)?undefined:b1,z:isMD(o2)?undefined:b2,k:isMD(o1)?b1:(isMD(o2)?b2:undefined),m:(isMD(o1)&&isMD(o2))?b2:undefined};
    var first=x+' '+s1.sym+' '+b1;
    v.expr=((o1==='add'||o1==='sub')&&isMD(o2))?'('+first+') '+s2.sym+' '+b2:first+' '+s2.sym+' '+b2;
    v.stages=[s1,s2];v.r=r;v.ans=s2.ans;v.alt=ALT[key](v);
    return v;
  }
  return null;
}
function genMix(){
  var d=st.d,pr=st.mix==='rnd'?MIXP[rnd(0,MIXP.length-1)]:st.mix,ops=pr.split('-'),i,I,v,key,tp,P,O,c,s,pp;
  if(Math.random()<0.5)ops.reverse();
  key=ops[0]+'-'+ops[1];tp=KT[key];
  for(i=0;i<60;i++){I=pickItem(d);if(!(tp.nm&&I.money))break}

function genSingle(op){
  var d=st.d,i,I,L,t,a,b,k,ans,pp,expr,c,r,T,T2,lo,hi,qlo,qhi;
  if(op==='add'){a=pn(d);b=pn(d);ans=a+b;expr=a+' + '+b}
  else if(op==='sub'){do{a=pn(d);b=pn(d)}while(a<=b);ans=a-b;expr=a+' − '+b}
  else if(op==='mul'){a=pn(d);k=rnd(2,9);ans=a*k;expr=a+' × '+k}
  else{
    lo=d===1?4:Math.pow(10,d-1);hi=Math.pow(10,d)-1;
    do{k=rnd(2,9);qlo=Math.max(2,Math.ceil(lo/k));qhi=Math.floor(hi/k)}while(qlo>qhi);
    ans=rnd(qlo,qhi);a=ans*k;expr=a+' ÷ '+k;
  }
  for(i=0;i<80;i++){
    I=pickItem(d);
    L=TPL[op].filter(function(t){return I.money?!t.nm:!t.mo});
    if(L.length)break;
  }
  t=L[rnd(0,L.length-1)];
  pp=pair2();T=pk(THINGS[d-1]);T2=pk(CHEAP);
  c={a:a,b:b,k:k,I:I,C:pickC(I,d),P:pp[0],O:pp[1],T:T,T2:T2};
  r=t.f(c);
  var stg1=op==='add'||op==='sub'?stg(SYMO[op],a,b):stg(SYMO[op],a,k);
  var extra=op==='add'?[Math.abs(a-b)]:op==='sub'?[a+b]:op==='mul'?[a+k]:[];
  return mkQ(r.s,r.h,ans,expr,[stg1],extra);
}

function choicesK(ans,extras){
  var set=[ans],deltas=[-10,-1,1,10,2,-2,-9,9,11,-11,-100,100],tries=0,i,e;
  for(i=0;i<extras.length;i++){e=extras[i];if(e>0&&e<=ans*4+50&&set.indexOf(e)<0&&set.length<4)set.push(e)}
  while(set.length<4&&tries<300){tries++;var c=ans+deltas[rnd(0,deltas.length-1)];if(c>0&&set.indexOf(c)<0)set.push(c)}
  var n=1;while(set.length<4){if(set.indexOf(ans+n)<0)set.push(ans+n);n++}
  for(i=set.length-1;i>0;i--){var j=rnd(0,i),t=set[i];set[i]=set[j];set[j]=t}
  return set;
}

/* müzik: C – Am – F – G, 4 ölçü, sekizlik adımlar */
var MEL=[76,79,76,72,79,76,79,null, 81,79,76,72,76,79,81,null, 77,81,84,81,77,81,84,null, 79,83,79,74,71,74,79,null];
var BASS=[48,45,41,43];
function musStep(s,t){
  var c=AU.ctx,m=MEL[s],bar=Math.floor(s/8),k=s%8,sp=60/AU.bpm/2;
  if(m!==null)tone(mf(m),t,sp*1.6,'triangle',0.55,AU.mg);
  if(k===0||k===4)tone(mf(BASS[bar]+(k===4?7:0)),t,sp*3.2,'sine',0.7,AU.mg);
  if(k===0||k===4){
    var o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
    g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.connect(g);g.connect(AU.mg);o.start(t);o.stop(t+0.16);
  }
  if(k===2||k===6){
    var src=c.createBufferSource(),hp=c.createBiquadFilter(),hg=c.createGain();
    src.buffer=AU.nb;hp.type='highpass';hp.frequency.value=6000;hg.gain.value=0.18;
    src.connect(hp);hp.connect(hg);hg.connect(AU.mg);src.start(t);
  }
}
function musSched(){
  var c=AU.ctx;
  if(!c||!AU.run)return;
  if(AU.next<c.currentTime)AU.next=c.currentTime+0.05;
  while(AU.next<c.currentTime+0.25){
    try{musStep(AU.step,AU.next)}catch(e){}
    AU.next+=60/AU.bpm/2;AU.step=(AU.step+1)%32;
  }
}
function musStart(){
  if(!AU.mus||AU.run)return;
  var c=auCtx();if(!c)return;

}

var ANIM=['🐱','🐶','🐰','🐼','🦁','🐵','🐧','🐸','🐥','🐘'];
var GHEARTS=3;
function gTime(n){return n<10?8000:(n<20?6000:(n<30?5000:4000))}

function bestSet(op,v){
  var p=st.profile;
  if(p===null){gGuest[op]=v;return}
  var b=ls('mc_best',{});if(!b[p])b[p]={};b[p][op]=v;lsSet('mc_best',b);
}
function gQ(){
  var g=st.g;
  if(g.race)RNG=mulb(g.race.seed*7919+g.log.length*104729+13);
  try{return gQ0()}finally{RNG=null}
}
function gQ0(){
  var g=st.g,op=g.op==='rnd'?['add','sub','mul','div'][rnd(0,3)]:g.op,a,b,ans,txt,alt,i,t;
  for(t=0;t<50;t++){
    if(op==='add'){a=rnd(1,9);b=rnd(1,9);ans=a+b;txt=a+' + '+b;alt=[ans+1,ans-1,ans+2,ans-2,ans+10,Math.abs(a-b)]}
    else if(op==='sub'){a=rnd(2,9);b=rnd(1,a-1);ans=a-b;txt=a+' − '+b;alt=[ans+1,ans-1,ans+2,ans-2,a+b]}
    else if(op==='mul'){a=rnd(2,9);b=rnd(2,9);ans=a*b;txt=a+' × '+b;alt=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,a+b]}
    else{b=rnd(2,9);ans=rnd(2,9);a=b*ans;txt=a+' ÷ '+b;alt=[ans+1,ans-1,ans+2,ans-2,b,a-b]}
    if(txt!==g.lastTxt)break;
  }
  g.lastTxt=txt;
  var pool=[];alt.forEach(function(v){if(v>=0&&v!==ans&&pool.indexOf(v)<0)pool.push(v)});
  var n=3;while(pool.length<3){if(ans+n!==ans&&pool.indexOf(ans+n)<0)pool.push(ans+n);n++}
  for(i=pool.length-1;i>0;i--){var j=rnd(0,i),tmp=pool[i];pool[i]=pool[j];pool[j]=tmp}
  var vals=pool.slice(0,3);vals.push(ans);
  for(i=vals.length-1;i>0;i--){var k=rnd(0,i),t2=vals[i];vals[i]=vals[k];vals[k]=t2}
  var an=ANIM.slice();for(i=an.length-1;i>0;i--){var m=rnd(0,i),t3=an[i];an[i]=an[m];an[m]=t3}
  return {txt:txt,ans:ans,opts:vals.map(function(v,x){return {v:v,e:an[x]}})};
}

function gStartTimer(){

function gTick(){
  var g=st.g,now=Date.now(),dt=Math.min(now-g.last,200),f,pc;
  g.last=now;
  if(st.screen!=='game'||g.done||g.lock||document.hidden||st.modal)return;
  g.rem-=dt;g.el+=dt;
  var tk=Math.ceil(g.rem/1000);if(g.rem<=2000&&tk>0&&tk!==g.lt){g.lt=tk;sndTick()}
  pc=Math.max(0,g.rem/g.tm*100);
  f=document.getElementById('tfill');
  if(f){f.style.width=pc+'%';f.style.background=pc>50?'var(--ok)':(pc>25?'#e0a100':'var(--bad)')}
  if(g.rem<=0)gAnswer(null,null);
}
function gAnswer(i,el){
  var g=st.g;
  if(g.lock||g.done)return;
  g.lock=true;
  var q=g.q,right=i!==null&&q.opts[i].v===q.ans,sec=Math.round(g.el/100)/10,msg=document.getElementById('gmsg'),btns=document.querySelectorAll('#agrid .ani'),x;
  if(i===null)sec=g.tm/1000;
  if(right){
    var fr=g.el/g.tm,pt=fr<=0.25?3:(fr<=0.5?2:1);
    g.score+=pt;g.ok++;g.streak++;if(g.streak>g.bestStreak)g.bestStreak=g.streak;
    el.classList.add('ok');msg.style.color='var(--ok)';msg.textContent='Doğru! +'+pt+' 🎉';sndOk(pt);
  }else{
    g.bad++;g.streak=0;g.hearts--;
    if(el)el.classList.add('bad');
    for(x=0;x<btns.length;x++){if(q.opts[x].v===q.ans)btns[x].classList.add('ok')}
    msg.style.color='var(--bad)';msg.textContent=(i===null?'Süre doldu! ':'Yanlış! ')+q.txt+' = '+q.ans;sndBad();
  }
  g.log.push({q:q.txt,a:q.ans,ok:right,r:right?1:0,s:sec});
  gPills();gSave();
  if(g.race)raceSend(false);
  g.to=setTimeout(function(){
    if(st.screen!=='game'||g.done)return;
    if(g.hearts<=0)endGame();else gNext();
  },right?700:1600);
}
function gNext(){

  document.getElementById('gq').textContent=g.q.txt+' = ?';
  document.getElementById('agrid').innerHTML=gOptsHtml(g.q);
  var gm=document.getElementById('gmsg');gm.textContent='';
  if(g.tm!==old){gm.style.color='var(--accent)';gm.textContent='⚡ Hızlandı! Şimdi '+(g.tm/1000)+' saniye';sndFast();musTempo(g.tm)}
  g.lt=99;

}
function gSave(){
  var g=st.g;
  if(st.profile===null)return true;
  var l=records(),i,r={id:g.sid,p:st.profile,t:g.t,op:g.op,e:null,d:1,s:g.score,ok:g.ok,bad:g.bad,fix:0,qs:g.log,br:0,k:'g'};

  if(!v){toast('Önce adını yaz');return}
  lsSet('mc_gnick',v);st.profile=null;
  rmJoinCode(RJOIN,function(){go('home')});
}
function rmEnter(fb,code,host,room){
  rmReset();
  RM.code=code;RM.host=host;RM.room=room;RM.fb=fb;
  RM.nick=rmNick();
  var p={nick:RM.nick,score:0,hearts:GHEARTS,ok:0,bad:0,n:0,tt:0,done:false,ts:Date.now(),rid:room.created};
  return fb.setDoc(fb.doc(CL.db,'rooms',code,'players',CL.user.uid),p).then(function(){
    RM.unsubs.push(fb.onSnapshot(fb.doc(CL.db,'rooms',code),function(s){
      if(RM.code!==code)return;
      if(!s.exists()){toast('Oda kapatıldı');rmLeaveLocal();return}
      RM.room=s.data();
      if(RM.room.status==='playing'&&!RM.started){RM.started=true;rmCountdown()}
      else if(st.screen==='lobby')render();
    },function(){}));
    RM.unsubs.push(fb.onSnapshot(fb.collection(CL.db,'rooms',code,'players'),function(qs){
      var l=[];qs.forEach(function(d){var x=d.data();x.uid=d.id;if(RM.room&&x.rid===RM.room.created)l.push(x)});
      RM.players=l;rmRefresh();
    },function(){}));
    go('lobby');
  });
}
function rmStart(){
  if(!RM.host||!RM.fb||!RM.room)return;
  var r=RM.room,d={host:r.host,hostNick:r.hostNick,op:r.op,status:'playing',seed:r.seed,created:r.created};
  RM.fb.setDoc(RM.fb.doc(CL.db,'rooms',RM.code),d).catch(function(e){toast(rmErr(e))});
}
function rmLeaveLocal(){
  var wasGame=st.screen==='game';
  rmReset();
  if(wasGame&&st.g){st.g.done=true;if(st.g.to)clearTimeout(st.g.to)}
  go('rooms');
}
function rmLeave(){
  var fb=RM.fb,code=RM.code,lobby=RM.room&&RM.room.status==='lobby';
  if(fb&&code&&CL.user&&lobby){
    if(RM.host)fb.deleteDoc(fb.doc(CL.db,'rooms',code)).catch(function(){});
    fb.deleteDoc(fb.doc(CL.db,'rooms',code,'players',CL.user.uid)).catch(function(){});
  }
  rmLeaveLocal();
}
function rmCountdown(){
  var n=3;
  go('rcount');
  RM.cd=setInterval(function(){
    n--;
    if(n<=0){clearInterval(RM.cd);RM.cd=null;raceStart();return}
    var e=document.getElementById('cdn');if(e)e.textContent=n;
    sndPop();
  },1000);
}
function raceStart(){
  st.g={op:RM.room.op,sid:Date.now(),t:new Date().toISOString(),score:0,ok:0,bad:0,streak:0,bestStreak:0,hearts:GHEARTS,log:[],tm:8000,lt:99,rem:8000,el:0,last:Date.now(),lock:false,done:false,lastTxt:'',to:null,bestOld:0,newBest:false,race:{code:RM.code,seed:RM.room.seed}};
  st.g.q=gQ();musTempo(8000);
  go('game');
  raceSend(false);
}
function raceSend(done){
  var g=st.g,tt=0;
  if(!g||!g.race||!RM.fb||!CL.user)return;
  g.log.forEach(function(x){tt+=x.s});
  RM.fb.setDoc(RM.fb.doc(CL.db,'rooms',RM.code,'players',CL.user.uid),{nick:RM.nick,score:g.score,hearts:g.hearts,ok:g.ok,bad:g.bad,n:g.log.length,tt:Math.round(tt*10)/10,done:!!done||g.hearts<=0,ts:Date.now(),rid:RM.room.created}).catch(function(){});
}
function raceSorted(){
  var g=st.g,me=CL.user?CL.user.uid:null,l=RM.players.map(function(p){
    if(g&&g.race&&p.uid===me){
      var tt=0;g.log.forEach(function(x){tt+=x.s});
      return {uid:p.uid,nick:p.nick,score:g.score,hearts:g.hearts,ok:g.ok,bad:g.bad,n:g.log.length,tt:tt,done:g.done||g.hearts<=0,ts:Date.now()};
    }
    return p;
  });
  l.sort(function(a,b){return (b.score-a.score)||((a.tt||0)-(b.tt||0))||(a.nick<b.nick?-1:1)});
  return l;
}
function myRank(){
  var l=raceSorted(),me=CL.user?CL.user.uid:'',i;
  for(i=0;i<l.length;i++){if(l[i].uid===me)return i+1}
  return 1;
}
function rankHtml(){
  var l=raceSorted(),me=CL.user?CL.user.uid:'',h='',i;
  for(i=0;i<l.length;i++){
    if(i<4||l[i].uid===me)h+='<div class="rrow'+(l[i].uid===me?' me':'')+'"><span>'+(i+1)+'. '+esc(l[i].nick)+'</span><span>'+l[i].score+' · '+(l[i].done?'🏁':'❤️'+l[i].hearts)+'</span></div>';
  }
  return h;
}
function lobbyList(){
  var h='';

  return h;
}
function rmRefresh(){
  var s=st.screen,e;
  if(s==='lobby'){
    e=document.getElementById('lb-list');if(e)e.innerHTML=lobbyList();
    e=document.getElementById('lb-n');if(e)e.textContent=RM.players.length;
  }else if(s==='game'&&st.g&&st.g.race){
    e=document.getElementById('g-rank');if(e)e.innerHTML=rankHtml();
    gPills();

}
function roverState(){
  var l=raceSorted(),now=Date.now(),all=true;
  l.forEach(function(p){if(!p.done&&now-p.ts<90000)all=false});
  return {l:l,all:all};
}

    else h+='<div class="rrow'+(p.uid===me?' me':'')+'"><span>'+(i+1)+'. '+esc(p.nick)+'</span><span>'+p.score+(p.done?'':' ⏳')+'</span></div>';
  }

  var g=st.g,rk=myRank(),me2=document.getElementById('r-me');

  var sv=document.getElementById('r-save'),ex=document.getElementById('r-exit');

  if(ex){ex.disabled=!s.all;ex.textContent=s.all?'🏠 Yarıştan Çık':'⏳ Yarış bitene kadar bekle'}
  if(s.all&&!RM.fin){RM.fin=true;rhistSave(s);if(myRank()===1)sndWin()}
  drawRace(document.getElementById('rcard'),s);

/* ---------- rekorlar tablosu + yarış geçmişi ---------- */
var LBV={kind:'solo',op:'add',from:'home',seq:0};
function lbCol(kind,op){return (kind==='race'?'lbr_':'lbg_')+op}
function lbName(s){return String(s||'').trim().slice(0,12)||'Misafir'}
function lbNick(){return st.profile||ls('mc_gnick','')||'Misafir'}
function lbRank(rows,score){var n=0,i;for(i=0;i<rows.length;i++){if(rows[i].score>score)n++}return {rank:n+1,over:n>=50}}
function lbTop(fb,col){
  return fb.getDocs(fb.query(fb.collection(CL.db,col),fb.orderBy('score','desc'),fb.limit(50))).then(function(qs){
    var rows=[];qs.forEach(function(d){var x=d.data();rows.push({uid:d.id,nick:x.nick,score:x.score})});
    rows.sort(function(a,b){return b.score-a.score});
    return rows;
  });
}
function lbSubmit(kind,op,score,cand,nick){
  if(!(score>0))return Promise.resolve(null);
  if(!navigator.onLine)return Promise.resolve({err:'İnternet yok: rekor tablosuna yazılamadı'});
  var col=lbCol(kind,op),nm=lbName(nick),fb,old=null,best,improved;
  return devAuth().then(function(f){
    fb=f;if(!CL.user)throw 0;
    return fb.getDoc(fb.doc(CL.db,col,CL.user.uid));
  }).then(function(s){
    old=s.exists()?s.data():null;
    best=Math.max(cand,old?old.score:0);
    improved=!old||cand>old.score;
    if(improved||old.nick!==nm)return fb.setDoc(fb.doc(CL.db,col,CL.user.uid),{nick:nm,score:best,ts:Date.now()});
  }).then(function(){return lbTop(fb,col)}).then(function(rows){
    var r=lbRank(rows,best);
    return {best:best,rank:r.rank,over:r.over,celebrate:improved&&score>=cand,improved:improved,kind:kind,op:op};
  }).catch(function(){return {err:'Rekor tablosuna bağlanılamadı'}});
}
function lbBoxHtml(r){
  if(!r)return '';
  if(r.loading)return '<div class="pbox lbx">🏆 Rekorlar tablosu kontrol ediliyor…</div>';
  if(r.err)return '<div class="pbox lbx">'+esc(r.err)+'</div>';
  var m,rk=r.over?'50+':r.rank+'.';
  if(r.celebrate&&r.rank===1)m='🏆 <b>Tebrikler, oyundaki en yüksek puanı aldınız!</b>';
  else if(r.celebrate&&r.rank<=10)m='🎉 <b>Tebrikler! En yüksek rekorlarda '+r.rank+'. sıradasınız!</b>';
  else if(r.celebrate)m='Rekorlar listesinde <b>'+rk+'</b> sıradasınız. İlk 10 için biraz daha!';
  else m='Tablodaki rekorun: <b>'+r.best+'</b> · Sıran: <b>'+rk+'</b>';
  return '<div class="pbox lbx">'+m+'</div><button class="ghost" onclick="lbOpen(\''+r.kind+'\',\''+r.op+'\')">🏆 Rekorlar Tablosunu Gör</button>';
}
function lbShowBox(g){
  var e=document.getElementById('lb-box');
  if(e&&st.g===g)e.innerHTML=lbBoxHtml(g.lb);
}
function lbRun(g,kind,cand,nick){
  g.lb={loading:true};lbShowBox(g);
  lbSubmit(kind,g.op,g.score,cand,nick).then(function(res){
    g.lb=res;lbShowBox(g);
    if(res&&res.celebrate&&res.rank<=10)confetti(res.rank===1);
  });
}
function confetti(big){
  var c=document.createElement('canvas'),W=window.innerWidth,H=window.innerHeight,x,n=big?170:70,P=[],i,t0=Date.now(),cols=['#fde047','#7048e8','#1f9d55','#d64545','#38bdf8','#fb923c'],dur=big?4500:2800;
  c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';
  c.width=W;c.height=H;x=c.getContext('2d');
  if(!x)return;
  document.body.appendChild(c);
  for(i=0;i<n;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-0.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-0.5)*0.3,c:cols[i%cols.length]});
  (function f(){
    var el=Date.now()-t0;
    x.clearRect(0,0,W,H);
    P.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);x.restore();
    });
    if(el<dur)requestAnimationFrame(f);else if(c.parentNode)c.parentNode.removeChild(c);
  })();
}
function lbOpen(kind,op){
  if(kind)LBV.kind=kind;
  if(op)LBV.op=op;
  if(st.screen!=='lb')LBV.from=st.screen;
  go('lb');
}
function lbSet(kind,op){if(kind)LBV.kind=kind;if(op)LBV.op=op;render()}
function lbTabsHtml(){
  var h='<div class="tabs"><button class="'+(LBV.kind==='solo'?'on':'')+'" onclick="lbSet(\'solo\')">🧠 Akıldan İşlem</button><button class="'+(LBV.kind==='race'?'on':'')+'" onclick="lbSet(\'race\')">🏁 Yarış Odası</button></div><div class="chips">';
  ['add','sub','mul','div','rnd'].forEach(function(o){h+='<button class="chip'+(LBV.op===o?' on':'')+'" onclick="lbSet(null,\''+o+'\')">'+(o==='rnd'?'🎲 Karışık':OPS[o].sym+' '+OPS[o].name)+'</button>'});
  return h+'</div>';
}
function lbLoad(){
  var body=document.getElementById('lb-body'),seq=++LBV.seq,kind=LBV.kind,op=LBV.op,col=lbCol(kind,op),fb,rows;
  if(!body)return;
  if(!navigator.onLine){body.innerHTML='<p class="sub center">Rekorlar tablosu için internet gerekir.</p>';return}
  body.innerHTML='<p class="sub center">Yükleniyor…</p>';
  devAuth().then(function(f){fb=f;if(!CL.user)throw 0;return lbTop(fb,col)}).then(function(r){
    rows=r;
    var me=CL.user.uid,i;
    for(i=0;i<rows.length;i++){if(rows[i].uid===me)return rows[i].score}
    return fb.getDoc(fb.doc(CL.db,col,me)).then(function(s){return s.exists()?s.data().score:null});
  }).then(function(mine){
    if(seq!==LBV.seq||st.screen!=='lb')return;
    var me=CL.user.uid,h='',i,med=['🥇','🥈','🥉'],r,shown=false,title=LBV.kind==='race'?'Yarış Odası':'Akıldan İşlem';
    h+='<div class="tag">'+title+' · '+gLabel(op)+' · en yüksek puanlar</div>';
    if(!rows.length)h+='<p class="sub center">Henüz kimse yok. İlk rekoru sen kır!</p>';
    for(i=0;i<rows.length&&i<10;i++){
      r=rows[i];
      h+='<div class="rrow'+(r.uid===me?' me':'')+'"><span>'+(i<3?med[i]:(i+1)+'.')+' '+esc(r.nick)+'</span><b>'+r.score+'</b></div>';
      if(r.uid===me)shown=true;
    }
    if(!shown&&mine!==null){
      var rk=lbRank(rows,mine);
      h+='<div class="tag">…</div><div class="rrow me"><span>'+(rk.over?'50+':rk.rank+'.')+' Sen</span><b>'+mine+'</b></div>';
    }else if(mine===null&&rows.length)h+='<p class="sub center">Bu kategoride henüz rekorun yok.</p>';
    body.innerHTML=h;
  }).catch(function(){if(seq===LBV.seq&&body)body.innerHTML='<p class="sub center">Tablo yüklenemedi, tekrar dene.</p>'});
}
function rhistSave(s){
  var g=st.g,p=st.profile;
  if(!p||!g||!RM.room)return;
  var l=ls('mc_rhist',[]),b=ls('mc_rbest',{}),op=RM.room.op,prev=(b[p]&&b[p][op])||0;
  l.unshift({p:p,t:Date.now(),code:RM.code,op:op,rank:myRank(),n:s.l.length,score:g.score,top:s.l.slice(0,10).map(function(x){return {n:x.nick,s:x.score}})});
  lsSet('mc_rhist',l.slice(0,100));
  g.rnew=g.score>prev&&g.score>0;
  if(g.rnew){if(!b[p])b[p]={};b[p][op]=g.score;lsSet('mc_rbest',b)}
}
function rhistHtml(){
  var p=st.profile,l=ls('mc_rhist',[]).filter(function(x){return x.p===p}).slice(0,30),b=(ls('mc_rbest',{})[p])||{},h='<div class="tag">Yarış rekorların</div>',any=false,i;
  ['add','sub','mul','div','rnd'].forEach(function(o){if(b[o]){any=true;h+='<div class="rrow"><span>'+(o==='rnd'?'🎲 Karışık':OPS[o].sym+' '+OPS[o].name)+'</span><b>🏆 '+b[o]+'</b></div>'}});
  if(!any)h+='<p class="sub center">Henüz yarış rekorun yok.</p>';

  }
  return h;

/* ---------- çizim ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r,fill){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=fill;c.fill()}
function drawMonster(c,cx,cy,r){
  var body='#8b5cf6',dark='#7040e0',i,a;
  [-1,1].forEach(function(s){
    c.beginPath();c.ellipse(cx+s*r*0.42,cy+r*0.98,r*0.26,r*0.2,0,0,Math.PI*2);c.fillStyle=dark;c.fill();
    circ(c,cx+s*r*1.02,cy+r*0.25,r*0.21,dark);
    circ(c,cx+s*r*0.55,cy-r*0.95,r*0.17,'#fbbf24');
  });
  for(i=0;i<30;i++){a=i/30*Math.PI*2;circ(c,cx+Math.cos(a)*r*0.97,cy+Math.sin(a)*r*0.97,r*0.14,i%2?body:'#9d73fa')}
  circ(c,cx,cy,r*0.97,body);
  c.beginPath();c.ellipse(cx,cy+r*0.48,r*0.56,r*0.4,0,0,Math.PI*2);c.fillStyle='#ddd6fe';c.fill();
  [-1,1].forEach(function(s){
    circ(c,cx+s*r*0.33,cy-r*0.18,r*0.23,'#fff');
    circ(c,cx+s*r*0.33,cy-r*0.15,r*0.11,'#1e1b4b');
    circ(c,cx+s*r*0.33-r*0.04,cy-r*0.2,r*0.04,'#fff');
    circ(c,cx+s*r*0.6,cy+r*0.1,r*0.1,'rgba(255,120,170,.55)');
  });
  c.beginPath();c.arc(cx,cy+r*0.08,r*0.27,Math.PI*0.12,Math.PI*0.88);
  c.strokeStyle='#1e1b4b';c.lineWidth=r*0.055;c.lineCap='round';c.stroke();
  rr(c,cx-r*0.07,cy+r*0.3,r*0.14,r*0.11,r*0.03);c.fillStyle='#fff';c.fill();
}
var FONT='system-ui,-apple-system,Segoe UI,Roboto,sans-serif';

function fmtSec(s){if(s<60)return s.toFixed(1).replace('.',',')+' sn';return Math.floor(s/60)+' dk '+Math.round(s%60)+' sn'}
function fmtClock(s){return pad(Math.floor(s/60))+':'+pad(Math.floor(s%60))}
function elapsed(){return (st.acc+(st.qStart?Date.now()-st.qStart:0))/1000}
function pauseT(){if(st.screen==='quiz'&&st.qStart){st.acc+=Date.now()-st.qStart;st.qStart=null}}
function resumeT(){if(st.screen==='quiz'&&!st.qStart&&!st.modal&&!st.onBreak&&st.picked===null)st.qStart=Date.now()}
document.addEventListener('visibilitychange',function(){if(document.hidden)pauseT();else resumeT()});
function fmtTime(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function histData(){
  var cut=Date.now()-14*86400000;
  var recs=records().filter(function(r){return r.p===st.profile&&new Date(r.t).getTime()>=cut}).sort(function(a,b){return a.t<b.t?1:-1}).slice(0,80);
  var days=[],map={};
  recs.forEach(function(r){
    var dt=new Date(r.t),day=fmtDate(dt);
    if(!map[day]){map[day]={day:day,rows:[],total:0};days.push(map[day])}
    var av=null;if(r.qs&&r.qs.length){var t0=0;r.qs.forEach(function(x){t0+=x.s});av=t0/r.qs.length}
    map[day].rows.push({lab:catLabel(r.op,r.e,r.d,r.k,r.m),dt:dt,s:r.s,ok:r.ok,bad:r.bad,fix:r.fix||0,av:av});
    map[day].total+=r.s;
  });
  return days;
}
function fitText(c,t,x,y,maxW,size,wt){var sz=size;c.font=wt+' '+sz+'px '+FONT;while(c.measureText(t).width>maxW&&sz>16){sz--;c.font=wt+' '+sz+'px '+FONT}c.fillText(t,x,y)}
function drawHistory(cv){
  var days=histData(),W=1080,H=500,total=0,y,c;
  days.forEach(function(d){total+=d.total;H+=100+d.rows.length*120});
  if(!days.length)H+=140;
  H+=70;
  cv.width=W;cv.height=H;c=cv.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  drawMonster(c,W/2,200,105);
  c.textAlign='center';
  c.fillStyle='#1d2433';c.font='800 46px '+FONT;c.fillText('Matematik Canavarı · '+st.profile,W/2,385);
  c.fillStyle='#6b7385';c.font='500 36px '+FONT;c.fillText('Son 14 gün · Toplam: '+total+' puan',W/2,440);
  y=500;
  if(!days.length){c.fillStyle='#6b7385';c.font='500 40px '+FONT;c.fillText('Henüz kayıtlı skor yok.',W/2,y+80)}
  days.forEach(function(d){
    c.textAlign='left';c.fillStyle='#7048e8';c.font='800 44px '+FONT;c.fillText(d.day,70,y+55);
    c.textAlign='right';c.fillStyle='#1d2433';c.font='800 42px '+FONT;c.fillText('Gün toplamı: '+d.total,W-70,y+55);
    c.fillStyle='#e0daf0';c.fillRect(70,y+75,W-140,3);
    y+=100;
    d.rows.forEach(function(x){
      c.textAlign='left';c.fillStyle='#1d2433';fitText(c,x.lab,70,y+38,720,34,'700');
      c.fillStyle='#6b7385';c.font='400 28px '+FONT;
      c.fillText(fmtDate(x.dt)+' '+fmtTime(x.dt)+' · '+(x.ok+x.fix+x.bad)+' soru · '+x.ok+'✓ '+x.fix+'↻ '+x.bad+'✗'+(x.av!==null?' · ort. '+fmtSec(x.av):''),70,y+84);
      c.textAlign='right';c.fillStyle=x.s<0?'#d64545':'#1f9d55';c.font='800 40px '+FONT;
      c.fillText((x.s>0?'+':'')+x.s+' puan',W-70,y+52);
      y+=120;
    });
  });
  c.textAlign='center';c.fillStyle='#9aa3b5';c.font='400 28px '+FONT;c.fillText(fmtDate(new Date())+' '+fmtTime(new Date()),W/2,H-30);
}

function drawReport(cv){
  var L=st.log,n=L.length,W=1080,sum=0,mn=1e9,mx=0,sc=0,nc=0,c,y;
  L.forEach(function(x){sum+=x.s;if(x.s<mn)mn=x.s;if(x.s>mx)mx=x.s;if(x.ok){sc+=x.s;nc++}});
  var H=1570+(n?110+n*76:120)+100;
  cv.width=W;cv.height=H;c=cv.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  var g=c.createLinearGradient(0,0,0,740);g.addColorStop(0,'#6d3df2');g.addColorStop(1,'#2a1b6e');
  c.fillStyle=g;c.fillRect(0,0,W,740);
  drawMonster(c,W/2,160,85);
  var t0=new Date(st.t||Date.now());
  c.textAlign='center';
  c.fillStyle='#fff';c.font='800 58px '+FONT;c.fillText('Matematik Canavarı',W/2,345);
  c.fillStyle='#ddd6fe';c.font='600 46px '+FONT;c.fillText(st.profile||'Misafir',W/2,405);
  c.font='500 34px '+FONT;c.fillText(st.last.label,W/2,455);
  c.font='400 30px '+FONT;c.fillText(fmtDate(t0)+' '+fmtTime(t0),W/2,500);
  c.fillStyle='#fde047';c.font='800 190px '+FONT;c.fillText(String(st.last.score),W/2,670);
  c.fillStyle='#fff';c.font='600 40px '+FONT;c.fillText('PUAN',W/2,722);
  var cards=[
    ['Doğru (ilk denemede)',String(st.last.ok),'#1f9d55'],['Düzeltti (2. denemede)',String(st.last.fix),'#d97706'],
    ['Yanlış',String(st.last.bad),'#d64545'],['İlk denemede doğru oranı',n?'%'+Math.round(100*st.last.ok/n):'-'],
    ['Toplam soru',String(n)],['Ortalama süre / soru',n?fmtSec(sum/n):'-'],
    ['Toplam süre',n?fmtSec(sum):'-'],['En hızlı · En yavaş',n?fmtSec(mn)+' · '+fmtSec(mx):'-'],
    ['İlk denemede doğrularda ort.',nc?fmtSec(sc/nc):'-'],['Acil mola',st.breakUsed?'Kullanıldı':'Kullanılmadı']
  ];
  cards.forEach(function(k,i){
    var x=50+(i%2)*500,yy=780+Math.floor(i/2)*150;
    c.fillStyle='#f4f1fb';rr(c,x,yy,480,130,24);c.fill();
    c.textAlign='left';c.fillStyle='#6b7385';c.font='500 28px '+FONT;c.fillText(k[0],x+28,yy+44);
    c.fillStyle=k[2]||'#1d2433';c.font='800 40px '+FONT;c.fillText(k[1],x+28,yy+100);
  });
  y=1570;
  if(!n){c.textAlign='center';c.fillStyle='#6b7385';c.font='500 40px '+FONT;c.fillText('Henüz cevaplanmış soru yok.',W/2,y+60);return}
  c.fillStyle='#6b7385';c.font='700 30px '+FONT;
  c.textAlign='left';c.fillText('#',70,y);c.fillText('Soru',150,y);
  c.textAlign='center';c.fillText('Sonuç',720,y);
  c.textAlign='right';c.fillText('Süre',W-70,y);
  c.fillStyle='#e0daf0';c.fillRect(50,y+14,W-100,3);
  y+=24;
  L.forEach(function(x,i){
    if(i%2===0){c.fillStyle='#f7f5fc';c.fillRect(50,y,W-100,76)}
    c.textAlign='left';c.fillStyle='#6b7385';c.font='600 32px '+FONT;c.fillText(String(i+1),70,y+50);
    c.fillStyle='#1d2433';fitText(c,x.q+' = '+x.a,150,y+50,500,36,'700');
    c.textAlign='center';c.fillStyle=x.r===1?'#1f9d55':(x.r===2?'#d97706':'#d64545');c.font='700 30px '+FONT;c.fillText(x.r===1?'✓ Doğru':(x.r===2?'↻ 2. denemede':'✗ Yanlış'),720,y+50);
    c.textAlign='right';c.fillStyle='#1d2433';c.font='800 34px '+FONT;c.fillText(fmtSec(x.s),W-70,y+50);
    y+=76;
  });
  c.textAlign='center';c.fillStyle='#9aa3b5';c.font='400 28px '+FONT;c.fillText('Rapor: '+fmtDate(new Date())+' '+fmtTime(new Date()),W/2,H-30);
}
function shareCanvas(cv,name){
  cv.toBlob(function(b){
    if(!b){toast('Görsel oluşturulamadı');return}
    var f=null;
    try{f=new File([b],name,{type:'image/png'})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'Matematik Canavarı'}).catch(function(){});
    }else{
      var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
      document.body.appendChild(a);a.click();a.remove();
      toast('Fotoğraf indirildi (İndirilenler / Galeri)');
    }
  },'image/png');
}
function saveCard(){shareCanvas(document.getElementById('card'),'matematik-canavari-rapor.png')}
function saveHist(){shareCanvas(document.getElementById('hist'),'matematik-canavari-skorlarim.png')}

function fmtLabel(){return st.vert?'↔ Yan yana göster':'↕ Alt alta göster'}
function qHtml(q,sol){
  if(q.html)return q.html+(sol?'<div class="pans">Cevap: <span class="sol">'+q.ans+'</span></div>':'');
  var rs=sol?'<span class="sol">'+q.ans+'</span>':'?';
  if(!st.vert)return sol?q.text.replace('?','<span class="sol">'+q.ans+'</span>'):q.text;
  if(q.sym==='÷')return '<div class="vdiv"><div class="dd">'+q.a+'</div><div class="dv"><div class="dt">'+q.b+'</div><div class="qq">'+rs+'</div></div></div>';
  return '<div class="vert"><div class="r">'+q.a+'</div><div class="r sp"><span>'+q.sym+'</span><span>'+q.b+'</span></div><div class="bar"></div><div class="r">'+rs+'</div></div>';
}
function toggleFmt(){
  st.vert=!st.vert;lsSet('mc_vert',st.vert);
  document.getElementById('qbox').innerHTML=qHtml(st.q,st.showSol);
  document.getElementById('fmtb').textContent=fmtLabel();
}
function modal(msg,yes,no,onYes,onNo){
  st.modal=true;pauseT();
  var ov=document.getElementById('ov');
  ov.className='';
  ov.innerHTML='<div class="box"><p>'+msg+'</p><button class="next" id="my">'+yes+'</button><button class="ghost" id="mn">'+no+'</button></div>';
  ov.hidden=false;
  document.getElementById('my').onclick=function(){closeModal();onYes()};
  document.getElementById('mn').onclick=function(){closeModal();if(onNo)onNo()};
}
function closeModal(){var ov=document.getElementById('ov');ov.hidden=true;ov.className='';ov.innerHTML='';st.modal=false}
function askFinish(){modal('Bitirmek istediğine emin misin?<br>Skor kartına geçilecek.','Evet, bitir','Hayır, devam et',finish,resumeT)}
function askBreak(){
  if(st.breakUsed||st.picked!==null)return;
  modal('Acil mola hakkını kullanmak istediğine emin misin?<br>Bu hak her oturumda yalnızca 1 kez kullanılabilir. Süre duracak.','Evet, mola ver','Hayır, devam et',startBreak,resumeT);
}
function startBreak(){
  st.breakUsed=true;st.onBreak=true;st.modal=true;pauseT();
  var b=document.getElementById('brk');if(b){b.disabled=true;b.textContent='⏸ Acil mola hakkı kullanıldı'}
  var ov=document.getElementById('ov');
  ov.className='solid';
  ov.innerHTML='<div class="box"><h2>⏸ Mola</h2><p>Süre durdu. Hazır olunca devam et.</p><button class="next" id="my">▶ Devam Et</button></div>';
  ov.hidden=false;
  document.getElementById('my').onclick=function(){closeModal();st.onBreak=false;resumeT()};
}
function askDelProfile(i){
  var n=profiles()[i];
  modal('<b>'+esc(n)+'</b> profilini silmek istediğine emin misin?<br>Bu profile ait tüm skorlar da silinir.','Evet, sil','Vazgeç',function(){
    var l=profiles();l.splice(i,1);lsSet('mc_profiles',l);
    lsSet('mc_records',records().filter(function(r){return r.p!==n}));
    var bb=ls('mc_best',{});delete bb[n];lsSet('mc_best',bb);
    if(st.profile===n)st.profile=null;
    toast('Profil silindi');render();
  });
}
function go(s){st.screen=s;render()}
function back(){
  var o=OPS[st.op],s=st.screen;
  if(s==='quiz'||s==='summary')return go('digits');
  if(s==='digits'){if(st.kind==='p')return go(st.op==='mix'?'mixmenu':'pmenu');return go(o&&o.mode?'mode':'ops')}
  if(s==='mode')return go('ops');
  if(s==='mixmenu')return go('pmenu');
  if(s==='gmenu')return go('home');
  if(s==='rooms')return go('home');
  if(s==='rjoin'){RJOIN=null;return go('welcome')}
  if(s==='lb')return go(LBV.from||'home');
  if(s==='rhist')return go('rooms');
  if(s==='rcreate')return go('rooms');
  if(s==='rover'){if(!roverState().all){toast('Yarış bitmeden çıkamazsın, bekle');return}return rmLeave()}
  if(s==='lobby')return rmLeave();
  if(s==='rcount')return;
  if(s==='game')return askQuitGame();
  if(s==='gover')return go('gmenu');
  if(s==='ops'||s==='pmenu'||s==='history')return go('home');
  if(s==='home')return go('profiles');
  if(s==='profiles')return go('welcome');
}

    h=topBar('Karma İşlemler')+'<div class="col">';
    MIXP.forEach(function(m){h+='<button class="btn" onclick="pickMix(\''+m+'\')">'+MIXN[m]+'</button>'});
    h+='<button class="btn" onclick="pickMix(\'rnd\')">🎲 Rastgele</button></div>';
  }else if(s==='mode'){
    h=topBar(o.name)+'<div class="col">'+
      '<button class="btn" onclick="pickMode(false)">Eldesiz<small>'+(st.op==='add'?'Basamaklar toplanınca 10 olmaz':'Onluk bozmaya gerek yok')+'</small></button>'+
      '<button class="btn" onclick="pickMode(true)">Eldeli<small>'+(st.op==='add'?'Eldeli toplama':'Onluk bozarak çıkarma')+'</small></button></div>';
  }else if(s==='digits'){
    var isP=st.kind==='p',sub=(!isP&&o.mode)?(st.eldeli?'Eldeli':'Eldesiz'):'';
    h=topBar(isP?(st.op==='mix'?'Karma · '+MIXN[st.mix]:'Problem · '+o.name):o.name+(sub?' · '+sub:''))+'<div class="col">';
    for(var d=1;d<=4;d++){
      if(st.op==='sub'&&st.eldeli&&d===1)continue;
      var note=st.op==='mul'?'× 1 basamaklı sayı':st.op==='div'?'÷ 1 basamaklı sayı (kalansız)':st.op==='mix'?'Çarpma ve bölmede 1 basamaklı sayı':'';
      h+='<button class="btn" onclick="pickDigits('+d+')">'+d+' basamaklı'+(note?'<small>'+note+'</small>':'')+'</button>';
    }
    h+='</div>';
  }else if(s==='quiz'){
    var q=st.q,tag=catLabel(st.op,st.eldeli,st.d,st.kind,st.mix);
    h=topBar('Soru '+(st.idx+1))+'<div class="score">'+
      '<div class="pill main"><b id="p-sc">'+st.score+'</b>PUAN</div>'+
      '<div class="pill"><b id="p-ok">'+st.ok+'</b>Doğru</div>'+
      '<div class="pill"><b id="p-bad">'+st.bad+'</b>Yanlış</div>'+
      '<div class="pill"><b id="p-st">'+st.streak+'</b>Seri</div></div>'+
      '<div class="tag">'+tag+'</div>'+audioBtns()+(st.kind==='p'?'':'<div class="fmt"><button class="mini" id="fmtb" onclick="toggleFmt()">'+fmtLabel()+'</button></div>')+'<div class="q'+(q.html?' pq':'')+'" id="qbox">'+qHtml(q)+'</div><div class="col" id="opts">';
    q.opts.forEach(function(v){h+='<button class="btn opt" data-v="'+v+'" onclick="answer('+v+',this)">'+v+'</button>'});
    h+='</div><div class="msg" id="msg"></div><div id="steps"></div><button class="next" id="sol" hidden onclick="showSol()">💡 Sonucu Gör</button><button class="next" id="next" hidden onclick="nextQ()">Sonraki soru →</button><button class="ghost" onclick="askFinish()">🏁 Bitir ve Skoru Gör</button><button class="ghost" id="brk" onclick="askBreak()"'+(st.breakUsed?' disabled':'')+'>'+(st.breakUsed?'⏸ Acil mola hakkı kullanıldı':'⏸ Acil Mola (1 hak)')+'</button><div class="tag" id="saved"></div>';
  }else if(s==='summary'){
    h=topBar('Skorun')+'<canvas id="card" class="card wide"></canvas>'+
      (st.profile?'':'<p class="sub center">Misafir oturumu: bu sonuç kaydedilmedi.</p>')+
      '<button class="next" onclick="saveCard()">📷 Fotoğrafı Kaydet / Paylaş</button>'+
      '<button class="ghost" onclick="pickDigits('+st.d+')">Yeni Oturum</button>'+
      '<button class="ghost" onclick="go(\'home\')">Menüye Dön</button>';
  }else if(s==='history'){
    h=topBar('Skorlarım')+'<button class="next" onclick="saveHist()">📷 Fotoğrafı Kaydet / Paylaş</button><p class="sub center" id="hint"></p><canvas id="hist" class="card wide"></canvas>';
  }
  app.innerHTML=h;
  window.scrollTo(0,0);
  if(s==='welcome')drawMonster(document.getElementById('mon').getContext('2d'),240,245,150);
  if(s==='summary')drawReport(document.getElementById('card'));
  if(s==='gover')drawGame(document.getElementById('gcard'));
  if(s==='game'){gStartTimer();musStart()}
  if(s==='rover'){roverUpdate();if(!RM.chk)RM.chk=setInterval(roverUpdate,5000)}
  if(s==='lb')lbLoad();
  if(s==='history'){
    drawHistory(document.getElementById('hist'));
    var all=records(),mine=all.filter(function(r){return r.p===st.profile}).length;
    document.getElementById('hint').textContent='Bu telefonda toplam '+all.length+' kayıt var, '+st.profile+' için '+mine+' kayıt.';
  }
}

function pickProfile(i){st.profile=profiles()[i];go('home')}
function guest(){st.profile=null;go('home')}
function createProfile(){
  var v=document.getElementById('np').value.trim();
  if(!v){toast('Bir takma ad yaz');return}
  var l=profiles();
  if(l.indexOf(v)<0){l.push(v);if(!lsSet('mc_profiles',l))toast('Kayıt yapılamadı: tarayıcı depolaması kapalı olabilir')}
  st.profile=v;go('home');
}
function pickPOp(k){st.kind='p';st.op=k;st.mix=null;st.eldeli=null;go('digits')}
function pickMix(m){st.kind='p';st.op='mix';st.mix=m;st.eldeli=null;go('digits')}
function pickOp(k){st.kind='o';st.mix=null;st.op=k;st.eldeli=null;go(OPS[k].mode?'mode':'digits')}
function pickMode(e){st.eldeli=e;go('digits')}
function pickDigits(d){st.d=d;st.sid=Date.now();st.t=new Date().toISOString();st.idx=0;st.log=[];st.fix=0;st.breakUsed=false;st.onBreak=false;st.score=0;st.ok=0;st.bad=0;st.streak=0;st.seen={};newQ();go('quiz')}

function lockOpts(){document.querySelectorAll('#opts .opt').forEach(function(b){b.disabled=true})}
function answer(v,el){
  if(st.picked!==null)return;
  var right=v===st.q.ans,msg=document.getElementById('msg');
  if(st.tries===0){
    if(right){el.classList.add('ok');return resolve(1,msg)}
    st.tries=1;el.classList.add('bad');el.disabled=true;
    msg.style.color='var(--bad)';msg.textContent='Yanlış. Tekrar dene! (Bu denemede puan yok)';
    return;
  }
  if(right){el.classList.add('ok');return resolve(2,msg)}
  el.classList.add('bad');resolve(0,msg);
}
function resolve(r,msg){
  st.picked=1;
  var sec=Math.round(elapsed()*10)/10;
  st.log.push({q:st.q.expr||st.q.text.replace(' = ?',''),a:st.q.ans,ok:r===1,r:r,s:sec});
  lockOpts();
  var bb=document.getElementById('brk');if(bb)bb.disabled=true;
  if(r===1){st.ok++;st.streak++;st.score+=PTS;msg.style.color='var(--ok)';msg.textContent='Doğru! +'+PTS+' 🎉'}
  else if(r===2){st.fix++;st.streak=0;msg.style.color='var(--ok)';msg.textContent='Düzelttin! 👍 (2. denemede puan yok)'}
  else{st.bad++;st.streak=0;msg.style.color='var(--bad)';msg.textContent='Yanlış. Çözümü görmek için butona bas.'}
  if(r===1)sndOk(2);else if(r===2)sndOk(1);else sndBad();
  document.getElementById('p-sc').textContent=st.score;
  document.getElementById('p-ok').textContent=st.ok;
  document.getElementById('p-bad').textContent=st.bad;
  document.getElementById('p-st').textContent=st.streak;
  document.getElementById(r===0?'sol':'next').hidden=false;
  var saved=saveProgress(),sv=document.getElementById('saved');
  sv.textContent=st.profile===null?'👤 Misafir: skor kaydedilmiyor':(saved?'💾 Skor kaydedildi':'⚠️ Kaydedilemedi (tarayıcı depolaması kapalı)');
  sv.style.color=(saved||st.profile===null)?'var(--muted)':'var(--bad)';
}
var BNAME=['birler','onlar','yüzler','binler','on binler','yüz binler'];
function BN(i){return BNAME[i]||(i+'. basamak')}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function digs(n){return String(n).split('').map(Number)}
function cp(o){var r={};for(var k in o)r[k]=o[k].slice();return r}
function stepsAdd(a,b,ans){
  var A=digs(a).reverse(),B=digs(b).reverse(),N=String(ans).length,L=Math.max(A.length,B.length),list=[],carry=0,wr=[],an={},i;
  for(i=0;i<L;i++){
    var da=A[i]||0,db=B[i]||0,sm=da+db+carry,w=sm%10,nc=sm>=10?1:0,t;
    if(carry)an[i]=['+1'];
    t=BN(i)+' basamağı: '+da+' + '+db+(carry?' + 1 (elde)':'')+' = '+sm+'. ';
    t+=nc?(w+' yaz, 1 elde olarak '+BN(i+1)+' basamağına ekle.'):(sm+' yaz.');
    wr[i]=w;list.push({t:cap(t),hl:i,wr:wr.slice(),an:cp(an)});
    carry=nc;
  }
  if(carry){wr[N-1]=1;list.push({t:'Son eldeyi (1) '+BN(N-1)+' basamağına yaz.',hl:N-1,wr:wr.slice(),an:cp(an)})}
  return {kind:'tbl',N:N,a:a,b:b,sym:'+',list:list};
}
function stepsSub(a,b,ans){
  var A=digs(a).reverse(),B=digs(b).reverse(),N=A.length,list=[],lent=0,wr=[],an={},i;
  for(i=0;i<N;i++){
    var da=A[i],db=B[i]||0,cur=da-lent,bor=cur<db,r=(bor?cur+10:cur)-db,t='';
    if(lent){t+=BN(i)+' basamağından 1 verilmişti: '+da+' − 1 = '+cur+'. '}else{t+=BN(i)+' basamağı: '}
    if(bor){
      t+=cur+' sayısı, '+db+' sayısından küçük. '+cap(BN(i+1))+' basamağından 1 onluk alırız: '+(cur+10)+' − '+db+' = '+r+'.';
      an[i]=(an[i]||[]).concat(['+10']);an[i+1]=(an[i+1]||[]).concat(['−1']);
    }else{t+=cur+' − '+db+' = '+r+'.'}
    wr[i]=r;list.push({t:cap(t),hl:i,wr:wr.slice(),an:cp(an)});
    lent=bor?1:0;
  }
  return {kind:'tbl',N:N,a:a,b:b,sym:'−',list:list};
}
function stepsMul(a,b,ans){
  var A=digs(a).reverse(),N=String(ans).length,list=[],carry=0,wr=[],an={},i;
  for(i=0;i<A.length;i++){
    var x=A[i]*b,p=x+carry,w=p%10,nc=Math.floor(p/10),t;
    if(carry)an[i]=['+'+carry];
    t=BN(i)+' basamağı: '+A[i]+' × '+b+' = '+x+'. '+(carry?x+' + '+carry+' (elde) = '+p+'. ':'');
    t+=nc?(w+' yaz, '+nc+' elde olarak '+BN(i+1)+' basamağına ekle.'):(p+' yaz.');
    wr[i]=w;list.push({t:cap(t),hl:i,wr:wr.slice(),an:cp(an)});
    carry=nc;
  }
  if(carry){wr[N-1]=carry;list.push({t:'Son eldeyi ('+carry+') '+BN(N-1)+' basamağına yaz.',hl:N-1,wr:wr.slice(),an:cp(an)})}
  return {kind:'tbl',N:N,a:a,b:b,sym:'×',hlb:true,list:list};
}
function stepsDiv(a,b,ans){
  var D=digs(a),pos=0,cur=D[0],q='',list=[],first=true,prevRem=0;
  while(cur<b&&pos<D.length-1){pos++;cur=cur*10+D[pos]}
  for(;;){
    var qd=Math.floor(cur/b),prod=qd*b,rem=cur-prod,t;
    if(first){t=(pos>0?'İlk '+(pos+1)+' basamağı alırız: '+cur+'. ':'')}
    else{t='Kalan '+prevRem+'. Yanına '+D[pos]+' indir: '+cur+'. '}
    t+=cur+' sayısında '+b+' kaç kere var? '+qd+' kere. '+qd+' × '+b+' = '+prod+'. '+cur+' − '+prod+' = '+rem+'.';
    q+=qd;list.push({t:t,pos:pos,q:q});
    if(pos>=D.length-1)break;
    prevRem=rem;pos++;cur=rem*10+D[pos];first=false;
  }
  return {kind:'div',a:a,b:b,list:list};
}
function buildSteps(q){
  if(q.sym==='+')return stepsAdd(q.a,q.b,q.ans);
  if(q.sym==='−')return stepsSub(q.a,q.b,q.ans);
  if(q.sym==='×')return stepsMul(q.a,q.b,q.ans);
  return stepsDiv(q.a,q.b,q.ans);
}
function tblHtml(S,stp){
  var N=S.N,A=digs(S.a).reverse(),B=digs(S.b).reverse(),resLen=String(S.sym==='+'||S.sym==='×'?S.a*(S.sym==='×'?S.b:1)+(S.sym==='+'?S.b:0):S.a-S.b).length,c,r0='<td></td>',r1='<td></td>',r2='<td class="op">'+S.sym+'</td>',r4='<td></td>';
  for(c=N-1;c>=0;c--){
    var h=stp.hl===c?' hl':'',a=stp.an[c]?stp.an[c].join('<br>'):'';
    r0+='<td class="an">'+a+'</td>';
    r1+='<td class="'+h.trim()+'">'+(A[c]!==undefined?A[c]:'')+'</td>';
    r2+='<td class="'+((S.hlb&&c===0)||h?'hl':'')+'">'+(B[c]!==undefined?B[c]:'')+'</td>';
    var w=stp.wr[c];
    r4+='<td class="'+h.trim()+'">'+(w===undefined?'':(c>=resLen?'<span class="lz">'+w+'</span>':w))+'</td>';
  }
  return '<table class="st"><tr>'+r0+'</tr><tr>'+r1+'</tr><tr>'+r2+'</tr><tr><td class="bar" colspan="'+(N+1)+'"></td></tr><tr>'+r4+'</tr></table>';
}
function divStepHtml(S,stp){
  var d=String(S.a),k=stp.pos+1;
  return '<div style="text-align:center"><div class="vdiv"><div class="dd"><span class="hl">'+d.slice(0,k)+'</span>'+d.slice(k)+'</div><div class="dv"><div class="dt">'+S.b+'</div><div class="qq">'+stp.q+'</div></div></div></div>';
}
function renderSteps(){
  var S=st.steps,k=st.sk,n=S.list.length,stp=S.list[k-1];
  var multi=st.q.stages&&st.q.stages.length>1,pre=multi?(st.pst+1)+'. işlem · '+cap(SYMN[st.q.stages[st.pst].sym])+' · ':'';
  var h='<div class="tag">'+pre+'Adım '+k+' / '+n+'</div>'+(S.kind==='div'?divStepHtml(S,stp):tblHtml(S,stp))+'<div class="stext">'+stp.t+'</div>';
  if(k<n)h+='<button class="next" onclick="nextStep()">Sonraki adım →</button>';
  document.getElementById('steps').innerHTML=h;
  if(k===n){
    if(st.q.stages&&st.pst<st.q.stages.length-1){
      document.getElementById('steps').insertAdjacentHTML('beforeend','<div class="pbox"><b>Ara sonuç: <span class="sol">'+st.q.stages[st.pst].ans+'</span></b></div><button class="next" onclick="nextStage()">Sıradaki işleme geç →</button>');
    }else finishSol();
  }
}
function startStage(){var g=st.q.stages[st.pst];st.steps=buildSteps({sym:g.sym,a:g.a,b:g.b,ans:g.ans});st.sk=1;renderSteps()}
function nextStage(){st.pst++;startStage()}
function probIntro(){
  var q=st.q,h='<div class="pbox"><h3>📝 Problem çözme adımları</h3><p><b>1. Verilenler</b></p><ul>';
  q.given.forEach(function(g){h+='<li>'+g+'</li>'});
  h+='</ul><p><b>2. Ne isteniyor?</b></p><div>'+q.ask+'</div><p><b>3. Hangi işlemi yapacağız?</b></p><div>'+q.hint+'</div>';
  if(q.stages.length>1){
    h+='<p><b>4. İşlem sırası</b></p><ol>';
    q.stages.forEach(function(g,i){h+='<li>'+(i===0?'Önce ':'Sonra ')+SYMN[g.sym]+': '+(i===0?g.a+' '+g.sym+' '+g.b:'ara sonuç '+g.sym+' '+g.b)+'</li>'});
    h+='</ol>';
  }
  h+='</div><button class="next" onclick="startStage()">'+(q.stages.length>1?'İlk işlemi çözelim →':'İşlemi çözelim →')+'</button>';
  document.getElementById('steps').innerHTML=h;
}
function nextStep(){st.sk++;renderSteps()}
function finishSol(){
  st.showSol=true;
  document.getElementById('qbox').innerHTML=qHtml(st.q,true);
  var msg=document.getElementById('msg');msg.style.color='var(--ok)';msg.textContent='Doğru cevap: '+st.q.ans;
  document.getElementById('next').hidden=false;
}
function showSol(){
  document.getElementById('sol').hidden=true;
  document.getElementById('opts').style.display='none';
  document.getElementById('msg').textContent='';
  if(st.q.stages){st.pst=0;probIntro();return}
  st.steps=buildSteps(st.q);st.sk=1;
  renderSteps();
}
function nextQ(){st.idx++;newQ();render()}
function saveProgress(){
  if(st.profile===null)return true;
  var l=records(),i,r={id:st.sid,p:st.profile,t:st.t,op:st.op,e:st.eldeli,d:st.d,s:st.score,ok:st.ok,bad:st.bad,fix:st.fix,qs:st.log,br:st.breakUsed?1:0,k:st.kind==='p'?'p':undefined,m:st.op==='mix'?st.mix:undefined};
  for(i=l.length-1;i>=0;i--){if(l[i].id===st.sid){l[i]=r;break}}
  if(i<0)l.push(r);
  var done=lsSet('mc_records',l);
  if(!done)toast('Skor kaydedilemedi: tarayıcı depolaması kapalı olabilir');
  else cloudQueue();
  return done;
}
function finish(){
  st.last={score:st.score,ok:st.ok,bad:st.bad,fix:st.fix,label:catLabel(st.op,st.eldeli,st.d,st.kind,st.mix)};
  go('summary');
}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})}
st.vert=ls('mc_vert',false);
render();
