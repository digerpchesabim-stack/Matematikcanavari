:root{--bg:#e6eeff;--bg2:#f7faff;--card:#fff;--text:#16203c;--muted:#566282;--accent:#2f6bff;--accent-d:#1b45c0;--accent-t:#fff;--gold:#ffc531;--gold2:#ffdb70;--gold-d:#cf8a00;--gold-t:#3a2600;--ok:#0c9a67;--ok-bg:#d4f6e7;--ok-d:#087a50;--bad:#e0444a;--bad-bg:#ffe1e1;--bad-d:#b3262c;--line:#cddaf6;--edge:#b3c4ec;--sh:rgba(27,45,100,.16);--me:#e3ecff;--me-t:#12297a;--glow:rgba(47,107,255,.28);--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#0b1230;--bg2:#141e48;--card:#1b2654;--text:#eef2ff;--muted:#a6b3da;--accent:#7ba0ff;--accent-d:#3f63cc;--accent-t:#0a1233;--gold:#ffc531;--gold2:#ffdb70;--gold-d:#b87900;--gold-t:#3a2600;--ok:#3fd29a;--ok-bg:#103d30;--ok-d:#1c8a63;--bad:#ff8086;--bad-bg:#4a1d24;--bad-d:#b3404a;--line:#2c3a74;--edge:#0a0f2a;--sh:rgba(0,0,0,.45);--me:#263a86;--me-t:#eef2ff;--glow:rgba(123,160,255,.35)}}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1230;--bg2:#141e48;--card:#1b2654;--text:#eef2ff;--muted:#a6b3da;--accent:#7ba0ff;--accent-d:#3f63cc;--accent-t:#0a1233;--gold:#ffc531;--gold2:#ffdb70;--gold-d:#b87900;--gold-t:#3a2600;--ok:#3fd29a;--ok-bg:#103d30;--ok-d:#1c8a63;--bad:#ff8086;--bad-bg:#4a1d24;--bad-d:#b3404a;--line:#2c3a74;--edge:#0a0f2a;--sh:rgba(0,0,0,.45);--me:#263a86;--me-t:#eef2ff;--glow:rgba(123,160,255,.35)}
:root[data-theme="sepia"]{color-scheme:light;--bg:#f1e4c8;--bg2:#fbf3e0;--card:#fffaf0;--text:#3a2a18;--muted:#7a6447;--accent:#c2501a;--accent-d:#8c330b;--accent-t:#fff;--gold:#ffc531;--gold2:#ffdb70;--gold-d:#c27f00;--gold-t:#3a2600;--ok:#3f7f24;--ok-bg:#e2efd0;--ok-d:#2e5f19;--bad:#b3382a;--bad-bg:#f6dccf;--bad-d:#86271c;--line:#e4d2ab;--edge:#d0b987;--sh:rgba(90,60,20,.18);--me:#fbe3cf;--me-t:#6b2607;--glow:rgba(194,80,26,.25)}
:root[data-theme="ocean"]{color-scheme:light;--bg:#d6f0f1;--bg2:#f0fbfb;--card:#fff;--text:#0f2e3a;--muted:#4b7080;--accent:#078a8a;--accent-d:#055f63;--accent-t:#fff;--gold:#ffc531;--gold2:#ffdb70;--gold-d:#c98600;--gold-t:#3a2600;--ok:#12905a;--ok-bg:#d3f3e2;--ok-d:#0c6c43;--bad:#d24a4a;--bad-bg:#fbdfdf;--bad-d:#a23030;--line:#b9dfe2;--edge:#9bcdd2;--sh:rgba(10,70,80,.16);--me:#d2f1f1;--me-t:#044548;--glow:rgba(7,138,138,.25)}
:root[data-theme="hc"]{color-scheme:light;--bg:#fff;--bg2:#fff;--card:#fff;--text:#000;--muted:#1a1a1a;--accent:#0033cc;--accent-d:#001a80;--accent-t:#fff;--gold:#ffd400;--gold2:#ffe14d;--gold-d:#000;--gold-t:#000;--ok:#00632a;--ok-bg:#c9f2d6;--ok-d:#003d1a;--bad:#b00000;--bad-bg:#ffd6d6;--bad-d:#6e0000;--line:#000;--edge:#000;--sh:rgba(0,0,0,.25);--me:#dbe4ff;--me-t:#000;--glow:rgba(0,51,204,.3)}
html,body{font-family:"MCP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bg2) 0%,transparent 70%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button{cursor:pointer;touch-action:manipulation}
b,strong,h1,h2,h3{font-weight:700}
h1{font-weight:800;letter-spacing:-.01em}
.sub{font-size:15.5px;line-height:1.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* üst çubuk */
.top{gap:12px;margin-bottom:18px}
.title{font-size:20px;font-weight:700;line-height:1.2}
.back{width:48px;height:48px;padding:0;border-radius:16px;border:1.5px solid var(--line);font-size:20px;font-weight:700;flex:none;box-shadow:0 4px 0 var(--edge),0 8px 14px var(--sh);transition:transform .08s,box-shadow .08s}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
/* kabartmalı düğmeler: alt kenar = derinlik, basınca çöker */
.btn,.ghost,.next,.mini,.chip,.ani,.del,.tabs button,.emg button,.nmtab button,.tmb,.thc,.vupd,.msge button{transition:transform .08s ease-out,box-shadow .08s ease-out,background-color .15s}
.btn{border:1.5px solid var(--line);border-radius:var(--r);padding:20px 12px;font-weight:700;line-height:1.25;box-shadow:0 5px 0 var(--edge),0 12px 20px var(--sh)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 3px 6px var(--sh)}
.btn small{font-weight:500;font-size:14.5px;line-height:1.35}
.btn .big{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 8px;border-radius:18px;font-size:30px;line-height:1;color:var(--accent);background:linear-gradient(160deg,var(--bg2),var(--me));box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.08),0 3px 0 var(--edge)}
.hgrid{gap:12px;margin-bottom:12px}
.hgrid .btn{padding:14px 8px 12px}
.hgrid .btn .big{width:56px;height:56px;font-size:29px;margin-bottom:6px}

function nmClaim(e,want,self){
  var loc=profiles().filter(function(x){return x!==self}),c=[want||0],i;
  for(i=0;i<6;i++)c.push(nmRnd(100,999));
  for(i=0;i<6;i++)c.push(nmRnd(1000,9999));
  c=c.filter(function(n,j){return c.indexOf(n)===j&&loc.indexOf(nmMake(e,n))<0});
  var off=function(){return {e:e,n:want||c.filter(function(n){return n>=1000})[0]||nmRnd(1000,9999),c:false}};
  if(!navigator.onLine)return Promise.resolve(off());
  return devAuth().then(function(fb){
    if(!CL.user)throw 0;
    var k=0,step=function(){
      if(k>=c.length)throw 0;
      var n=c[k++];
      return fb.setDoc(fb.doc(CL.db,'nm',nmKey(e,n)),{u:CL.user.uid,t:Date.now()}).then(function(){return {e:e,n:n,c:true}},function(er){if(er&&er.code==='permission-denied')return step();throw er});
    };
    return step();
  }).catch(off);
}

function profRename(o,nw,info){

  l[i]=nw;lsSet('mc_profiles',l);
  ['mc_best','mc_rbest','mc_pid','mc_rk'].forEach(function(k){var b=ls(k,{});if(o in b){b[nw]=b[o];delete b[o];lsSet(k,b)}});
  ['mc_records','mc_rhist','mc_dhist'].forEach(function(k){var x=ls(k,[]),ch=false;x.forEach(function(r){if(r&&r.p===o){r.p=nw;ch=true}});if(ch)lsSet(k,x)});
  var nm=nmMap();delete nm[o];nm[nw]=info;lsSet('mc_nm',nm);
  if(PRO.c&&o in PRO.c)PRO.c[nw]=PRO.c[o];
  if(st.profile===o)st.profile=nw;
  if(FR.prof===o)FR.prof=nw;

function peStTxt(){
  var P=st.pe,p=P.i>=0?profiles()[P.i]:null,m=p?nmInfo(p):null;
  if(m&&m.e===P.e)return 'Şu anki adın';
  if(P.free===undefined||P.fk!==P.e)return navigator.onLine?'Bakılıyor…':'İnternet yok: numara sonra verilir';
  return P.free?'✨ Bu karakter boş, numarasız senin olur':'Bu karakter alınmış, yanına numara eklenecek';

function peCheck(){
  var P=st.pe;if(!P)return;
  var k=P.e,mine=nmMake(P.e,0);
  clearTimeout(P.tm);P.free=undefined;P.fk=k;
  var up=function(){var e=document.getElementById('pe-st');if(e)e.textContent=peStTxt()};
  if(profiles().indexOf(mine)>=0&&profiles()[P.i]!==mine){P.free=false;up();return}
  up();if(!navigator.onLine)return;
  P.tm=setTimeout(function(){
    devAuth().then(function(fb){if(!CL.user)throw 0;return fb.getDoc(fb.doc(CL.db,'nm',nmKey(P.e,0)))}).then(function(s){
      if(st.pe!==P||P.fk!==k)return;
      P.free=!s.exists()||(CL.user&&s.data().u===CL.user.uid&&profiles().indexOf(mine)<0);up();
    }).catch(function(){});
  },350);
}
function peSave(){
  var P=st.pe;if(!P||P.busy)return;
  var old=P.i>=0?profiles()[P.i]:null,om=old?nmInfo(old):null;
  if(old&&om&&om.e===P.e){nmDone(old);go(P.ret);return}

}
function peSaveGo(){
  var P=st.pe,b=document.getElementById('pe-go');if(!P||P.busy)return;
  var old=P.i>=0?profiles()[P.i]:null,om=old?nmInfo(old):null;
  P.busy=true;if(b){b.disabled=true;b.textContent='⏳ Ad ayrılıyor…'}

    P.busy=false;

      var l=profiles();l.push(nw);

var RNG=null;
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rnd(a,b){return Math.floor((RNG?RNG():Math.random())*(b-a+1))+a}
function num(d){return d===1?rnd(1,9):rnd(Math.pow(10,d-1),Math.pow(10,d)-1)}
function hasCarry(a,b){var c=0,any=false;while(a>0||b>0){var s=a%10+b%10+c;if(s>=10){any=true;c=1}else c=0;a=Math.floor(a/10);b=Math.floor(b/10)}return any}
function hasBorrow(a,b){var br=0,any=false;while(a>0||b>0){var da=a%10-br,db=b%10;if(da<db){any=true;br=1}else br=0;a=Math.floor(a/10);b=Math.floor(b/10)}return any}
function genQuestion(){
  var op=st.op,d=st.d,a,b,i;
  if(op==='add'){for(i=0;i<5000;i++){a=num(d);b=num(d);if(hasCarry(a,b)===st.eldeli)break}return {text:a+' + '+b+' = ?',ans:a+b,a:a,b:b,sym:'+'}}
  if(op==='sub'){for(i=0;i<5000;i++){a=num(d);b=num(d);if(a<b){var t=a;a=b;b=t}if(a!==b&&hasBorrow(a,b)===st.eldeli)break}return {text:a+' − '+b+' = ?',ans:a-b,a:a,b:b,sym:'−'}}
  if(op==='mul'){a=d===1?rnd(2,9):num(d);b=rnd(2,9);return {text:a+' × '+b+' = ?',ans:a*b,a:a,b:b,sym:'×'}}
  b=rnd(2,9);
  var lo=d===1?1:Math.pow(10,d-1),hi=Math.pow(10,d)-1;
  var q=rnd(Math.ceil(lo/b),Math.floor(hi/b));
  return {text:(b*q)+' ÷ '+b+' = ?',ans:q,a:b*q,b:b,sym:'÷'};
}
function choices(ans){
  var set=[ans],deltas=[-10,-1,1,10,-100,100,2,-2,-9,9,11,-11],tries=0;
  while(set.length<4&&tries<200){tries++;var c=ans+deltas[rnd(0,deltas.length-1)];if(c>=0&&set.indexOf(c)<0)set.push(c)}
  var n=1;while(set.length<4){if(set.indexOf(ans+n)<0)set.push(ans+n);n++}
  for(var i=set.length-1;i>0;i--){var j=rnd(0,i),t=set[i];set[i]=set[j];set[j]=t}
  return set;
}
function newQ(){
  var q,i;
  for(i=0;i<60;i++){q=st.kind==='p'?genProblem():genQuestion();if(!st.seen[q.text])break}
  st.seen[q.text]=1;q.opts=st.kind==='p'?choicesK(q.ans,q.extra):choices(q.ans);st.q=q;st.picked=null;st.tries=0;st.showSol=false;st.acc=0;st.qStart=Date.now();
}

var IVT={sent:'📨 çağrıldı',seen:'👀 gördü',ok:'✅ geliyor',busy:'⏳ meşgul',later:'🕐 sonra',gone:'🙂 gelemiyor'};
function ivWatch(fb,code,to,ts){
  if(RM.code!==code)return;
  var un=fb.onSnapshot(fb.doc(CL.db,'iv',to),function(s){ivSeen(code,to,s.exists()?s.data():null,ts)},function(){});
  if(RM.code!==code){try{un()}catch(e){}return}
  RM.unsubs.push(un);
}
function rmHasPid(pid){return RM.players.some(function(p){return p.pid===pid})}
function ivSeen(code,to,x,ts){
  var o=RM.ivs&&RM.ivs[to];
  if(RM.code!==code||!o||o.ts!==ts)return;
  if(!x){
    if(o.st==='sent'||o.st==='seen')setTimeout(function(){var q=RM.ivs&&RM.ivs[to];if(RM.code===code&&q===o&&!rmHasPid(to)&&(o.st==='sent'||o.st==='seen')){o.st='gone';ivUi(to)}},4000);
    return;
  }
  if(x.from!==FR.pid||x.ts!==ts)return;
  var ns=x.rs||'sent';if(ns===o.st)return;
  o.st=ns;o.rr=x.rr;o.ra=x.ra;ivUi(to);
}
function ivUi(to){
  var o=RM.ivs&&RM.ivs[to];if(!o||st.screen!=='lobby')return;
  ivSumUi();
  if(o.g){var mi0=document.getElementById('mm-inv');if(mi0)mi0.innerHTML=mmInvHtml();return}
  if(duMM()){
    var mi=document.getElementById('mm-inv');if(mi)mi.innerHTML=mmInvHtml();
    if(o.st==='busy')toast(o.nick+' şu an meşgul');else if(o.st==='later')toast(o.nick+' daha sonra oynamak istiyor');
    return;
  }
  var e=document.getElementById('iv-st');if(e)e.innerHTML=ivStHtml();
  if(o.shown||st.modal)return;
  if(o.st==='busy'){o.shown=1;modal('⏳ <b>'+esc(o.nick)+'</b> şu an meşgul.<br>Sonra oynarsınız 🙂','Tamam',null,function(){rmLeave();go('home')})}
  else if(o.st==='later'&&o.rr&&o.ra){o.shown=1;rvLaterAsk(o)}
}
function rvLaterAsk(o){
  var id=o.rr+'_'+FR.pid;
  RV.seen[id]=1;
  modal3('🕐 <b>'+esc(o.nick)+'</b> şimdi oynayamıyor.<br>Saat <b>'+hhmm(o.ra)+'</b> için ('+rvLeft(o.ra)+') oynamak istiyor. Olur mu?',[
    ['✅ Olur',function(){rvAns(id,'ok');rmLeave();go('rvl')}],
    ['Gelemem',function(){rvAns(id,'no');rmLeave();go('home')}]
  ],function(){});

function ivStHtml(){
  var to=RM.inv&&RM.inv.to,o=to&&RM.ivs&&RM.ivs[to];if(!o)return '';
  var n='<b>'+esc(o.nick)+'</b>',s,home='<button class="next" onclick="rmLeave();go(\'home\')">🏠 Ana menüye dön</button>';
  if(o.st==='ok')s='✅ '+n+' geliyor…';
  else if(o.st==='busy')s='⏳ '+n+' şu an meşgul. Sonra oynarsınız 🙂'+home;
  else if(o.st==='later')s='🕐 '+n+' saat '+(o.ra?hhmm(o.ra):'')+' için oynamak istiyor.<br><small>Zamanlı Oyun\'dan cevap verebilirsin.</small>'+home;

/* ---------- S55: 📣 Herkesi çağır (sadece çevrim içi arkadaşlar) ---------- */
function ivSendOne(to,nick,g){
  var r=RM.room;if(!r||!RM.code||!FR.pid)return Promise.resolve(false);
  var d={from:FR.pid,nick:lbName(FR.prof),room:RM.code,op:r.op,lv:r.lv||'k',win:r.win||10,ts:Date.now()};
  if(r.mode==='mm')d.md='mm';else if(r.mode!=='duel')d.md='race';
  if(g)d.g=1;
  RM.invs=RM.invs||{};RM.ivs=RM.ivs||{};
  RM.invs[to]=1;RM.ivs[to]={st:'sent',t:Date.now(),nick:nick,ts:d.ts,g:g?1:0};
  var code=RM.code;
  return devAuth().then(function(fb){return fb.setDoc(fb.doc(CL.db,'iv',to),d).then(function(){ivWatch(fb,code,to,d.ts);pushSend(to,'iv');return true},function(){
    var o=RM.ivs&&RM.ivs[to];if(o&&o.ts===d.ts){delete RM.ivs[to];delete RM.invs[to]}return false;
  })}).catch(function(){return false});
}
function frAllOpen(){
  if(!st.profile||!FR.ready){toast('Önce karakterinle gir');return}

}
function frInvAll(){
  if(!RM.code||!FR.ready||!st.profile){toast('Önce karakterinle gir');return}
  var now=Date.now();
  if(FR.allT&&now-FR.allT<180000){toast('Herkesi tekrar çağırmak için '+Math.ceil((180000-(now-FR.allT))/60000)+' dakika bekle');return}
  var inr={};RM.players.forEach(function(p){if(p.pid)inr[p.pid]=1});
  var l=FR.list.filter(function(o){return frOnline(o)&&!inr[o]&&!(RM.ivs&&RM.ivs[o])});
  if(!l.length){toast('Şu an çağrılacak çevrim içi arkadaşın yok');return}
  FR.allT=now;RM.ivg=1;

    var n=rs.filter(Boolean).length;toast('📣 '+n+' kişi çağrıldı'+(n<l.length?' ('+(l.length-n)+' kişinin başka daveti vardı)':''));ivSumUi();
  });

function ivSumHtml(){
  if(!RM.ivg)return '';
  var c={n:0,seen:0,ok:0,busy:0},k;
  for(k in (RM.ivs||{})){var o=RM.ivs[k];if(!o.g)continue;c.n++;
    if(o.st==='ok'||rmHasPid(k))c.ok++;else if(o.st==='busy'||o.st==='gone')c.busy++;else if(o.st==='seen')c.seen++}
  return '<div class="pbox" style="text-align:center">📣 <b>'+c.n+'</b> kişi çağrıldı<br><small>👀 '+c.seen+' gördü · ✅ '+c.ok+' geliyor · ⏳ '+c.busy+' meşgul</small></div>';
}

var TM={k:null,d:null,pl:{},ti:null,tv:null,seen:{},list:null,lt:0,busy:false};
function tmKey(){var a=ls('mc_tm',{});return st.profile&&a[st.profile]!=null?+a[st.profile]:null}
function tmSetKey(k){if(!st.profile)return;var a=ls('mc_tm',{});if(k==null)delete a[st.profile];else a[st.profile]=k;lsSet('mc_tm',a);bkSoon()}
function tmName(k){var t=TMN[k];return k===-1?'👾 Canavar Takımı':(t?t[0]+' '+t[1]:'?')}
function tmE(k){var t=TMN[k];return k===-1?'👾':(t?t[0]:'❔')}
function tmMine(){return TM.d&&FR.pid&&TM.d.m&&TM.d.m.indexOf(FR.pid)>=0}
function tmIsCap(){return tmMine()&&TM.d.cap===FR.pid}
function tmStart(fb,id){
  TM.d=null;TM.ti=null;TM.tv=null;
  FR.unsub.push(fb.onSnapshot(fb.doc(CL.db,'tv',id),function(s){if(FR.pid!==id)return;TM.tv=s.exists()?s.data():null;tmCheck()},function(){}));
  tmWatch(fb,id);
}
function tmWatch(fb,id){
  if(TM.un){TM.un.forEach(function(u){try{u()}catch(e){}})}TM.un=[];
  var k=tmKey();if(k==null){TM.d=null;tmUi();return}
  TM.un.push(fb.onSnapshot(fb.doc(CL.db,'tm',String(k)),function(s){
    if(FR.pid!==id)return;
    var d=s.exists()?s.data():null;
    if(!d||!d.m||d.m.indexOf(id)<0){TM.d=null;if(tmKey()===k){tmSetKey(null);toast('Takımın artık yok')}tmUi();return}
    var old=TM.d;TM.d=d;
    if(old&&old.cap!==d.cap&&d.cap===id)toast('👑 Artık takımının kaptanısın!');
    tmLoadPl();tmUi();
  },function(){}));
  TM.un.push(fb.onSnapshot(fb.doc(CL.db,'ti',String(k)),function(s){if(FR.pid!==id)return;TM.ti=s.exists()?s.data():null;tmCheck()},function(){}));
}
function tmReWatch(){if(!FR.pid)return;var id=FR.pid;devAuth().then(function(fb){tmWatch(fb,id)})}
function tmLoadPl(){
  if(!TM.d)return;
  devAuth().then(function(fb){return Promise.all(TM.d.m.map(function(p){return fb.getDoc(fb.doc(CL.db,'pl',p)).then(function(s){if(s.exists())TM.pl[p]=s.data()},function(){})}))}).then(function(){tmUi()});
}
function tmNick(p){return p===FR.pid?lbName(FR.prof):((TM.pl[p]&&TM.pl[p].nick)||FR.nick[p]||'Oyuncu')}
function tmOn(p){if(p===FR.pid)return true;var x=TM.pl[p];return !!(x&&Date.now()-x.seen<150000)}
function tmUi(){
  if(st.modal)return;
  if(st.screen==='tml'){var e=document.getElementById('tm-body');if(e)e.innerHTML=tmBody()}
  if(st.screen==='home'){var b=document.getElementById('tm-home');if(b)b.innerHTML=tmHomeBtn()}
}
function tmHomeBtn(){
  if(!st.profile)return '';
  var k=tmKey();
  return '<button class="btn rkhome" onclick="tmOpen()"><span class="big" style="font-size:30px">'+(k!=null?tmE(k):'👥')+'</span><span>👥 Takımım<small>'+(k!=null?esc(TMN[k]?TMN[k][1]:'')+(TM.d?' · '+TM.d.m.length+' kişi · '+(TM.d.w|0)+' galibiyet':''):'Takım kur ya da takıma katıl')+'</small></span></button>';
}
function tmOpen(){
  if(!st.profile){toast('Takım için karakterinle gir');return}
  go('tml');frEnsure().then(function(){tmLoadPl();tmUi()});
}
/* takım ekranı */
function tmBody(){
  if(!navigator.onLine)return '<p class="sub center">Takımlar için internet gerekir.</p>';
  if(!FR.ready)return '<p class="sub center">⏳ Hazırlanıyor…</p>';
  var h='';
  if(TM.tv&&Date.now()-TM.tv.ts<86400000&&tmKey()!==TM.tv.t)h+='<div class="pbox" style="text-align:center">📩 <b>'+esc(nkShow(TM.tv.nick))+'</b> seni <b>'+esc(tmName(TM.tv.t))+'</b> takımına çağırıyor.<div class="cbtn"><button class="next" onclick="tmJoin()">✅ Katıl</button><button class="ghost" onclick="tmTvNo()">Hayır</button></div></div>';
  if(!TM.d){
    if(tmKey()!=null)return h+'<p class="sub center">⏳ Takımın yükleniyor…</p>';
    return h+'<div class="pbox" style="text-align:center"><div style="font-size:44px">👥</div><b>Henüz bir takımın yok.</b><br><small>Bir takım kur, arkadaşlarını çağır. Takımlar en çok 4 kişidir. Başka takımlarla <b>takım kapışması</b> yaparsınız.</small></div><button class="next" onclick="tmNewOpen()">➕ Takım kur</button><p class="sub center">Bir arkadaşın seni takımına çağırırsa davet burada görünür.</p>';
  }
  var d=TM.d,k=tmKey(),cap=d.cap;
  h+='<div class="pbox tmcard"><div class="tme">'+tmE(k)+'</div><div class="tmn">'+esc(TMN[k]?TMN[k][1]:'')+'</div><small>🏆 '+(d.w|0)+' galibiyet · 💪 '+(d.l|0)+' yenilgi</small></div>';
  h+='<div class="tag">Üyeler ('+d.m.length+'/4)</div>';
  d.m.slice().sort(function(a,b){return (b===cap)-(a===cap)}).forEach(function(p){var x=TM.pl[p]||{},on=tmOn(p);
    h+='<div class="rrow tap" onclick="'+(p===FR.pid?'rkMyCard()':'rkCardOpen(\''+p+'\',\''+esc(tmNick(p)).replace(/'/g,'')+'\')')+'"><span>'+(on?'🟢':'⚪')+' '+(typeof x.rk==='number'?rkMini(x.rk):'')+'<b>'+esc(nkShow(tmNick(p)))+'</b>'+(p===FR.pid?' <small>(sen)</small>':'')+'</span><span>'+(p===cap?'👑 Kaptan':'')+'</span></div>'});
  h+='<button class="next" onclick="twOpen()">'+tIcon(30)+' Takım Kapışması</button>';
  h+='<button class="ghost" onclick="twBotOpen()">👾 Canavar Takımına Karşı</button>';
  h+=tmCapHtml();
  if(d.m.length<4)h+='<div class="tag">➕ Arkadaşını takıma çağır</div>'+tmInvHtml();
  h+='<button class="ghost" style="margin-top:16px" onclick="tmLeave()">🚪 Takımdan ayrıl</button>';
  return h;
}
function tmCapHtml(){
  var d=TM.d;if(!d||d.m.length<2)return '<p class="sub center">👑 Takımda en az 2 kişi olunca <b>Kaptanlık Maçı</b> yapabilirsiniz.</p>';
  var ok=tmCapOk(),dt=d.ct?new Date(d.ct):null;
  var h='<div class="pbox" style="text-align:center">👑 <b>Kaptan:</b> '+esc(nkShow(tmNick(d.cap)))+(dt?'<br><small>Kaptanlık Maçı’nı kazandı ('+fmtDate(dt)+')</small>':'<br><small>Takımı kurduğu için geçici kaptan</small>');
  h+=ok?'<button class="next" style="margin-top:8px" onclick="tmCapGo()">👑 Kaptanlık Maçı yap</button><small>Kazanan kaptan olur. Rütbe puanı vermez.</small>':'<br><small>Bir sonraki Kaptanlık Maçı: '+fmtDate(new Date(d.ct+7*86400000))+'</small>';
  return h+'</div>';
}
function tmCapOk(){var d=TM.d;return !!d&&d.m.length>=2&&(!d.ct||Date.now()-d.ct>7*86400000||(d.jn|0)>d.ct)}
function tmInvHtml(){
  var inT=TM.d?TM.d.m:[],l=FR.list.filter(function(o){return inT.indexOf(o)<0});
  if(!l.length)return '<p class="sub center">Çağrılacak arkadaşın yok. Önce Arkadaşlarım’dan arkadaş ekle.</p>';
  var h='';l.slice(0,15).forEach(function(o){h+='<div class="rrow"><span>'+(frOnline(o)?'🟢':'⚪')+' '+esc(nkShow(FR.nick[o]||o))+'</span><button class="mini" onclick="tmInv(\''+o+'\')">📨 Çağır</button></div>'});
  return h;
}

var TMNEW={k:null,taken:{}};
function tmNewOpen(){TMNEW={k:null,taken:TMNEW.taken||{}};go('tmn')}
function tmnHtml(){
  var h=topBar('➕ Takım Kur')+'<p class="sub center">Takımının adını seç. Her ad tek bir takımındır; alınmışsa başka bir ad seç.</p><div class="tmg">';
  TMN.forEach(function(t,i){h+='<button class="tmb'+(TMNEW.k===i?' on':'')+(TMNEW.taken[i]?' off':'')+'" onclick="tmPick('+i+')"><span>'+t[0]+'</span><small>'+esc(t[1])+'</small></button>'});
  h+='</div><div class="tmbar"><div id="tm-st" class="sub center">'+(TMNEW.k==null?'Bir ad seç':'')+'</div><button class="next" id="tm-go" onclick="tmCreate()"'+(TMNEW.k==null?' disabled':'')+'>✅ Bu takımı kur</button></div>';
  return h;
}
function tmPick(i){
  TMNEW.k=i;render();
  var e=document.getElementById('tm-st');if(e)e.textContent='⏳ '+TMN[i][1]+' kontrol ediliyor…';
  devAuth().then(function(fb){return fb.getDoc(fb.doc(CL.db,'tm',String(i)))}).then(function(s){
    if(TMNEW.k!==i)return;var t=s.exists();TMNEW.taken[i]=t;
    var e2=document.getElementById('tm-st'),b=document.getElementById('tm-go');
    if(e2)e2.innerHTML=t?'😕 <b>'+esc(TMN[i][1])+'</b> başka bir takımın. Başka ad seç.':'✨ <b>'+TMN[i][0]+' '+esc(TMN[i][1])+'</b> boş, senin olabilir!';
    if(b)b.disabled=t;
  }).catch(function(){var e3=document.getElementById('tm-st');if(e3)e3.textContent='Kontrol edilemedi, internetini kontrol et'});
}
function tmCreate(){
  var k=TMNEW.k;if(k==null||TMNEW.taken[k])return;
  if(tmKey()!=null&&TM.d){toast('Zaten bir takımın var');return}
  if(!FR.pid){toast('Hazırlanıyor, biraz bekle');return}
  ovBusy('⏳ Takım kuruluyor…');
  devAuth().then(function(fb){return fb.setDoc(fb.doc(CL.db,'tm',String(k)),{m:[FR.pid],cap:FR.pid,by:FR.pid,w:0,l:0,ct:0,jn:0,lm:'',ts:Date.now(),v:1})}).then(function(){
    closeModal();tmSetKey(k);tmReWatch();frBeat();sndWin();toast('🎉 '+tmName(k)+' kuruldu! Arkadaşlarını çağır.');go('tml');
  }).catch(function(){closeModal();TMNEW.taken[k]=true;toast('Bu ad az önce alındı ya da kurulamadı, başka ad seç');render()});
}
/* takıma çağır / katıl / ayrıl */
function tmInv(o){
  var k=tmKey();if(k==null||!TM.d)return;
  if(TM.d.m.length>=4){toast('Takım dolu (en çok 4 kişi)');return}
  devAuth().then(function(fb){return fb.setDoc(fb.doc(CL.db,'tv',o),{t:k,from:FR.pid,nick:lbName(FR.prof),ts:Date.now()})}).then(function(){toast(nkShow(FR.nick[o]||'')+' takıma çağrıldı');pushSend(o,'tv')}).catch(function(){toast('Çağrılamadı, tekrar dene')});
}
function tmTvNo(){var v=TM.tv;TM.tv=null;tmUi();if(v&&FR.pid)devAuth().then(function(fb){return fb.deleteDoc(fb.doc(CL.db,'tv',FR.pid))}).catch(function(){})}
function tmJoin(){
  var v=TM.tv;if(!v)return;
  if(tmKey()!=null&&TM.d){modal('Zaten <b>'+esc(tmName(tmKey()))+'</b> takımındasın.<br>Önce takımından ayrılmalısın.','Tamam',null,function(){});return}
  var k=v.t,fb,tries=0;
  ovBusy('⏳ Takıma katılıyorsun…');
  var att=function(){
    return fb.getDoc(fb.doc(CL.db,'tm',String(k))).then(function(s){
      if(!s.exists())throw 'Bu takım artık yok';
      var d=s.data();if(d.m.indexOf(FR.pid)>=0)return;
      if(d.m.length>=4)throw 'Bu takım dolu (en çok 4 kişi)';
      return fb.updateDoc(fb.doc(CL.db,'tm',String(k)),{m:d.m.concat([FR.pid]),by:FR.pid,jn:Date.now(),ts:Date.now()}).catch(function(e){if(++tries<3)return att();throw e});
    });
  };
  devAuth().then(function(f){fb=f;return att()}).then(function(){
    closeModal();tmSetKey(k);TM.tv=null;fb.deleteDoc(fb.doc(CL.db,'tv',FR.pid)).catch(function(){});tmReWatch();frBeat();sndWin();toast('🎉 '+tmName(k)+' takımına katıldın!');go('tml');
  }).catch(function(e){closeModal();toast(typeof e==='string'?e:'Katılamadın, tekrar dene')});
}
function tmLeave(){
  var k=tmKey(),d=TM.d;if(k==null||!d)return;
  modal('<b>'+esc(tmName(k))+'</b> takımından ayrılmak istiyor musun?'+(d.m.length===1?'<br><small>Takımda başka kimse yok; takım silinir.</small>':''),'Evet, ayrıl','Vazgeç',function(){
    devAuth().then(function(fb){
      return fb.getDoc(fb.doc(CL.db,'tm',String(k))).then(function(s){
        if(!s.exists())return;var x=s.data(),m=x.m.filter(function(p){return p!==FR.pid});
        if(!m.length)return fb.deleteDoc(fb.doc(CL.db,'tm',String(k)));
        var cap=x.cap;
        if(cap===FR.pid||m.indexOf(cap)<0){cap=m.slice().sort(function(a,b){return ((TM.pl[b]||{}).rk|0)-((TM.pl[a]||{}).rk|0)})[0]}
        return fb.updateDoc(fb.doc(CL.db,'tm',String(k)),{m:m,by:FR.pid,cap:cap,ts:Date.now()});
      });
    }).then(function(){tmSetKey(null);TM.d=null;tmReWatch();frBeat();toast('Takımdan ayrıldın');tmUi()}).catch(function(){toast('Ayrılamadın, tekrar dene')});
  },null);
}
/* takım çağrısı (ti): kapışma ya da kaptanlık maçı kurulunca takım üyelerine */
var TMBUSY=['game','gcount','duel','dintro','dover','rcount','rover','lobby','quiz','summary','hgir','mig','rvn','tmn'];
function tmCheck(){
  if(!st.profile||st.modal||TMBUSY.indexOf(st.screen)>=0){tmUi();return}
  var t=TM.tv;
  if(t&&!TM.seen['v'+t.ts]&&Date.now()-t.ts<600000&&tmKey()!==t.t){
    TM.seen['v'+t.ts]=1;sndPop();
    modal3('👥 <b>'+esc(nkShow(t.nick))+'</b> seni <b>'+esc(tmName(t.t))+'</b> takımına çağırıyor!',[['✅ Katıl',tmJoin],['Hayır',tmTvNo],['Sonra bakarım',function(){}]],function(){});
    return;
  }
  var c=TM.ti,k=tmKey();
  if(c&&k!=null&&c.by!==FR.pid&&!TM.seen['i'+c.ts]&&Date.now()-c.ts<600000){
    TM.seen['i'+c.ts]=1;sndPop();
    var msg=c.cm?'👑 <b>'+esc(nkShow(c.nick))+'</b> takımında <b>Kaptanlık Maçı</b> kurdu!':(c.a===k?'⚔️ Takım arkadaşın <b>'+esc(nkShow(c.nick))+'</b>, '+esc(tmName(c.b))+' ile <b>takım kapışması</b> kurdu!':'⚔️ <b>'+esc(tmName(c.a))+'</b> takımı takımınıza meydan okuyor!');
    modal3(msg+'<br><small>Takımın seni bekliyor.</small>',[['⚔️ Katıl',function(){twJoin(c.room)}],['Şimdi değil',function(){}]],function(){});
  }
}
function tmCall(room,b,cm){
  var k=tmKey();if(k==null)return Promise.resolve();
  var d={by:FR.pid,nick:lbName(FR.prof),room:room,a:k,b:b,ts:Date.now()};if(cm)d.cm=1;
  return devAuth().then(function(fb){
    var ps=[fb.setDoc(fb.doc(CL.db,'ti',String(k)),d).then(function(){pushSend(String(k),'ti')})];
    if(b>=0&&!cm)ps.push(fb.setDoc(fb.doc(CL.db,'ti',String(b)),d).then(function(){pushSend(String(b),'ti')}));
    return Promise.all(ps);
  }).catch(function(){});
}
function twJoin(room){
  RM.tk=tmKey();
  rmJoinCode(room,null,true);
}
/* kaptanlık maçı */
function tmCapGo(){
  if(!tmCapOk())return;
  var n=TM.d.m.length;RC.mode=n>=3?'mm':'duel';RC.cm=tmKey();RC.code='';RC.win=10;RC.lv='k';

function tmCapWin(){

/* ---------- S56: ⚔️ takım kapışması (eşleşmeli) ---------- */
/* oda: mode 'tw', ka/kb takım (kb -1: Canavar Takımı), win = soru sayısı; başlarken kurucu pa yazar: "a1:b1,a2:~" (~ = bot) */
var TWQ=[10,15,20],TWS={opp:null,lv:'k',op:'add',nq:15};
function twOpen(){if(!TM.d){toast('Önce bir takıma katıl');return}TWS.opp=null;TM.list=null;go('tmv');twList()}
function twBotOpen(){if(!TM.d){toast('Önce bir takıma katıl');return}TWS.opp=-1;go('tms')}
function twList(){
  devAuth().then(function(fb){return fb.getDocs(fb.query(fb.collection(CL.db,'tm'),fb.orderBy('w','desc'),fb.limit(60)))}).then(function(qs){
    var l=[];qs.forEach(function(d){var x=d.data();x.k=+d.id;if(x.k!==tmKey()&&x.m&&x.m.length)l.push(x)});TM.list=l;
    if(st.screen==='tmv')render();
  }).catch(function(){TM.list=[];if(st.screen==='tmv')render()});
}
function tmvHtml(){
  var h=topBar(tIcon(30)+' Takım Kapışması')+'<p class="sub center">Rakip takımı seç. Takımına ve rakip takıma davet gider; gelenlerle oynarsınız.</p>';
  if(!TM.list)return h+'<p class="sub center">⏳ Takımlar yükleniyor…</p>';
  if(!TM.list.length)return h+'<p class="sub center">Henüz başka takım yok. Arkadaşların da takım kursun!</p><button class="ghost" onclick="twBotOpen()">👾 Canavar Takımına Karşı oyna</button>';
  TM.list.forEach(function(x){h+='<div class="rrow tap" onclick="twPick('+x.k+')"><span><span style="font-size:24px">'+tmE(x.k)+'</span> <b>'+esc(TMN[x.k]?TMN[x.k][1]:'?')+'</b><br><small>'+x.m.length+' kişi · 🏆 '+(x.w|0)+' · 💪 '+(x.l|0)+'</small></span><button class="mini">⚔️ Seç</button></div>'});

}
function twPick(k){TWS.opp=k;go('tms')}
function tmsHtml(){
  var o=TWS.opp,h=topBar(tmE(tmKey())+' ⚔️ '+tmE(o)+' Kapışma');
  h+='<div class="pbox" style="text-align:center"><b>'+esc(tmName(tmKey()))+'</b> ⚔️ <b>'+esc(tmName(o))+'</b>'+(o===-1?'<br><small>Takımın canavarlara karşı oynar. Alıştırma maçıdır, rütbe puanı vermez.</small>':'')+'</div>';
  h+='<div class="tag">Kaç soru?</div><div class="chips">';TWQ.forEach(function(n){h+='<button class="chip'+(TWS.nq===n?' on':'')+'" onclick="twSet(\'nq\','+n+')">'+n+' soru</button>'});
  h+='</div><div class="tag">Seviye</div><div class="chips">';['k','o','z'].forEach(function(l){h+='<button class="chip'+(TWS.lv===l?' on':'')+'" onclick="twSet(\'lv\',\''+l+'\')">'+LVN[l]+'</button>'});
  h+='</div><p class="sub center"><b>İşlemi seç, davet gitsin:</b></p><div class="col">';
  ['add','sub','mul','div','rnd'].forEach(function(op){h+='<button class="btn" onclick="twCreate(\''+op+'\')">'+(op==='rnd'?'🎲 Karışık':OPS[op].sym+' '+OPS[op].name)+'<small>'+lvDesc(op,TWS.lv).replace(/ · Süre.*$/,'')+'</small></button>'});
  return h+'</div><p class="sub center">Oyun başlayınca herkes karşı takımda kendi rütbesine yakın biriyle eşleşir. Her çift kendi arasında kapışır; puanlar takıma eklenir. Eksik kişi olursa 👾 Takım Canavarı tamamlar.</p>';
}
function twSet(k,v){TWS[k]=v;render()}
function twCreate(op){
  var k=tmKey();if(k==null||!TM.d||!FR.pid)return;
  var fb,code,tries=0,nick=rmNick();
  toast('Kapışma kuruluyor…');
  rmFb().then(function(f){
    fb=f;
    var d={host:CL.user.uid,hostNick:nick,op:op,status:'lobby',seed:Math.floor(Math.random()*1000000)+1,created:Date.now(),qv:5,lv:TWS.lv,tb:0,mode:'tw',win:TWS.nq,ka:k,kb:TWS.opp};
    var att=function(){code=rmCode();return fb.setDoc(fb.doc(CL.db,'rooms',code),d).then(function(){return d},function(e){if(++tries<5)return att();throw e})};
    return att();
  }).then(function(d){RM.tk=k;return rmEnter(fb,code,true,d).then(function(){tmCall(code,TWS.opp,false)})}).catch(function(e){toast(rmErr(e))});
}
function duTW(){return !!(RM.room&&RM.room.mode==='tw')}
function twSide(p){return (p.tk|0)===(RM.room.ka|0)?0:1}
function twTeams(){var A=[],B=[];RM.players.forEach(function(p){if(p.done)return;if(p.tk===RM.room.ka)A.push(p);else if(p.tk===RM.room.kb)B.push(p)});return [A,B]}
function twValid(){
  var T=twTeams(),a=T[0].length,b=T[1].length,bot=RM.room.kb===-1;

function twR(u,mate){
  if(!DU)return null;
  if(u===DU.me)return DU.myR;
  if(u==='~'){if(mate===DU.me)return DU.botR;var p=duP(mate);return p?(p.br||[]):[]}
  var q=duP(u);return q?(q.r||[]):[];
}
var TWP={};
function twGone(u,r){
  if(u==='~'||u===DU.me)return false;
  if(DU.gone&&DU.gone[u])return true;
  var p=duP(u);if(!p||p.done)return true;
  var n=(r||[]).length;if(n>=DU.nq)return false;
  var o=TWP[u];if(!o||o.n!==n){TWP[u]={n:n,t:Date.now()};return false}
  return Date.now()-o.t>40000;
}
function twState(){
  var pr=DU.pairs,S=[0,0],out=[],all=true;
  pr.forEach(function(x){
    var a=x[0],b=x[1],ra=twR(a,b),rb=twR(b,a),ga=twGone(a,ra),gb=twGone(b,rb),pa=0,pb=0,k,done=true;
    if(a==='~'&&b==='~')return;
    for(k=0;k<DU.nq;k++){
      var va=ra?ra[k]:undefined,vb=rb?rb[k]:undefined,ha=va!==undefined&&va!==null,hb=vb!==undefined&&vb!==null;
      if(ha&&hb){if(va>0&&(vb<=0||va<=vb))pa++;else if(vb>0)pb++}
      else if(ga&&hb){if(vb>0)pb++}else if(gb&&ha){if(va>0)pa++}
      else if(ga&&gb){}
      else if(ga&&!hb&&!gb){done=false}
      else if(gb&&!ha&&!ga){done=false}
      else done=false;
    }
    S[0]+=pa;S[1]+=pb;if(!done)all=false;
    out.push({a:a,b:b,pa:pa,pb:pb,done:done,ga:ga,gb:gb});
  });
  return {S:S,pairs:out,all:all};
}
function twNick(u){if(u==='~')return '👾 Takım Canavarı';if(u===DU.me)return RM.nick;return (DU.nick&&DU.nick[u])||((duP(u)||{}).nick)||'Oyuncu'}

/* rv/{ODA}_{alıcı} = {from, fn, to, room, op, lv, win, md, at, ts, st:'req'|'ok'|'no'|'x'(iptal)|'d'(başladı), n}
   Oda önceden kurulur (rooms.at = başlama zamanı). Saatinden 10 dk önce girilebilir, saati gelince başlar. */
var RVEXP=15*60000,RVPRE=10*60000;
var RV={inn:{},out:{},seen:{},st:{},del:{},tk:null};
function rvStart(fb,id){
  RV.inn={};RV.out={};
  FR.unsub.push(fb.onSnapshot(fb.query(fb.collection(CL.db,'rv'),fb.where('to','==',id)),function(qs){if(FR.pid!==id)return;var o={};qs.forEach(function(d){o[d.id]=d.data()});RV.inn=o;rvChanged()},function(){}));
  FR.unsub.push(fb.onSnapshot(fb.query(fb.collection(CL.db,'rv'),fb.where('from','==',id)),function(qs){if(FR.pid!==id)return;var o={};qs.forEach(function(d){o[d.id]=d.data()});RV.out=o;rvChanged()},function(){}));
  if(!RV.tk)RV.tk=setInterval(rvTick,15000);
}
function rvChanged(){
  var now=Date.now(),k,d,old=[];
  for(k in RV.out){d=RV.out[k];
    if(d.at+RVEXP<now){old.push(k);continue}
    var p=RV.st[k];
    if(p&&p!==d.st&&(d.st==='ok'||d.st==='no')){var nk=FR.nick[d.to]||'Arkadaşın';toast(d.st==='ok'?'✅ '+nk+' saat '+hhmm(d.at)+' randevusunu kabul etti':'🙂 '+nk+', saat '+hhmm(d.at)+' randevusuna gelemiyor')}
    RV.st[k]=d.st;
  }
  for(k in RV.inn){d=RV.inn[k];
    var q=RV.st[k];
    if(q&&q!==d.st&&d.st==='x')toast('🙂 '+nkShow(d.fn)+' saat '+hhmm(d.at)+' oyununu iptal etti');
    RV.st[k]=d.st;
    if(d.at+RVEXP<now)old.push(k);
  }
  if(old.length)rvClean(old);
  rvUi();rvCheck();
}
function rvClean(ids){
  ids=ids.filter(function(k){return !RV.del[k]});if(!ids.length||!navigator.onLine)return;
  devAuth().then(function(fb){ids.forEach(function(k){
    RV.del[k]=1;var d=RV.out[k]||RV.inn[k];
    fb.deleteDoc(fb.doc(CL.db,'rv',k)).catch(function(){});
    if(d&&RV.out[k]&&d.at+RVEXP<Date.now())fb.deleteDoc(fb.doc(CL.db,'rooms',d.room)).catch(function(){});
  })}).catch(function(){});
}
/* oda başına grup: kurucuysan davetlilerin durumu, davetliysen kendi cevabın */
function rvGroups(){
  var g={},now=Date.now(),k,d;
  var add=function(id,d,mine){
    if(d.at+RVEXP<now||d.st==='x'||d.st==='d')return;
    var x=g[d.room]||(g[d.room]={room:d.room,at:d.at,md:d.md,op:d.op,lv:d.lv,win:d.win,host:d.from,fn:d.fn,mine:mine,inv:[],n:d.n||1});
    if(mine)x.inv.push({id:id,to:d.to,st:d.st});else{x.me=d.st;x.id=id}
  };
  for(k in RV.out)add(k,RV.out[k],true);
  for(k in RV.inn)add(k,RV.inn[k],false);
  return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return a.at-b.at});
}
function rvLive(x){return x.mine?x.inv.some(function(i){return i.st==='ok'}):x.me==='ok'}
function rvWho(x){
  if(x.md==='mm')return '🛡️ Meydan Muharebesi'+(x.mine?'':' · kuran: <b>'+esc(nkShow(x.fn))+'</b>');
  return '⚔️ '+(x.mine?'<b>'+esc(nkShow(FR.nick[x.inv[0]&&x.inv[0].to]||'Arkadaşın'))+'</b> ile kapışma':'<b>'+esc(nkShow(x.fn))+'</b> ile kapışma');
}
function rvGirBtn(x){

/* gelen randevu isteği: oyun sırasında gösterme */
function rvCheck(){
  if(!st.profile||st.modal||FRBUSY.indexOf(st.screen)>=0||st.screen==='rvn')return;
  var k,d,now=Date.now();
  for(k in RV.inn){d=RV.inn[k];

    RV.seen[k]=1;sndPop();
    (function(id,d){

        ['✅ Olur, gelirim',function(){rvAns(id,'ok')}],
        ['Gelemem',function(){rvAns(id,'no')}],
        ['Sonra karar veririm',function(){toast('Zamanlı Oyun bölümünden cevap verebilirsin')}]
      ],function(){});
    })(k,d);
    return;
  }
}

/* davetli: Olur / Gelemem (muharebede en çok 3 kişi kabul edebilir: kurucuyla 4) */
function rvAns(id,s){
  var fb,d;
  RV.seen[id]=1;
  devAuth().then(function(f){fb=f;return fb.getDoc(fb.doc(CL.db,'rv',id))}).then(function(sn){
    if(!sn.exists())throw 'Bu randevu artık yok';
    d=sn.data();
    if(d.st==='x')throw 'Bu oyun iptal edilmiş';
    if(d.at+RVEXP<Date.now())throw 'Bu randevunun süresi geçmiş';
    if(s!=='ok'||d.md!=='mm')return s;
    return fb.getDocs(fb.query(fb.collection(CL.db,'rv'),fb.where('room','==',d.room))).then(function(qs){
      var n=0;qs.forEach(function(x){if(x.id!==id&&x.data().st==='ok')n++});
      if(n>=3){toast('Bu muharebe doldu (en çok 4 kişi). Başka sefere 🙂');return 'no'}
      return s;
    });
  }).then(function(s2){
    return fb.updateDoc(fb.doc(CL.db,'rv',id),{st:s2,ts:Date.now()}).then(function(){
      if(RV.inn[id])RV.inn[id].st=s2;
      if(s2==='ok')toast('✅ Kabul ettin. Oyun saati: '+hhmm(d.at));else if(s===s2)toast('Haber verildi 🙂');
      pushSend(d.from,'rva',{r:d.room});
      rvUi();
    });
  }).catch(function(e){toast(typeof e==='string'?e:'Gönderilemedi, tekrar dene')});
}
/* kurucu: iptal (bütün davetlilere haber gider, oda silinir) */
function rvCancel(room){
  modal('Bu zamanlı oyun iptal edilsin mi?<br><small>Davet ettiğin arkadaşlarına haber gider.</small>','Evet, iptal et','Vazgeç',function(){

/* Bir sembolün ön yüzü (ışıklı, kenarı pahlı) ve yan yüzü (koyu) bir kez çizilip saklanır; her karede katman katman basılır */
function chSprite(ch,col,sz,k){

}
function chSym(c,it,k,ds){
  var sp=chSprite(it.ch,it.col,it.sz,k),w=sp.w/k,h=sp.h/k,th=Math.sin(it.ph*0.55)*0.8,pt=Math.sin(it.ph*0.4+it.rot*9)*0.28,dep=it.sz*0.21,N=LITE?4:9,sx=Math.cos(th),sy=Math.cos(pt),ox=-Math.sin(th)*dep,oy=Math.sin(pt)*dep+dep*0.22,i,u;

      if(Math.random()<0.25)CH.cr.push({x:m.x+(Math.random()-0.5)*50,y:m.y+m.r*0.35,vx:(Math.random()-0.5)*120,vy:-Math.random()*120-40,s:4+Math.random()*4,l:0.7,col:f?f.col:'#f59e0b'})}

    LBC[col]={t:Date.now(),rows:rows};
    return rows.slice();
  });

    var dd={nick:nm,score:best,ts:Date.now()},rkv=(st.profile&&nick===st.profile)?rkMine():null;if(pid)dd.pid=pid;if(rkv!==null)dd.rk=rkv;

function lbBoxHtml(r){
  if(!r)return '';
  if(r.guest)return '<div class="pbox lbx">👤 Misafir puanları rekorlar tablosuna yazılmaz. Profil açarsan puanın tabloya girer.</div>';
  if(r.practice)return '<div class="pbox lbx">📘 Tablo çalışması: puanın rekorlar tablosuna yazılmaz.</div>';
  if(r.loading)return '<div class="pbox lbx">🏆 Rekorlar tablosu kontrol ediliyor…</div>';
  if(r.err)return '<div class="pbox lbx">'+esc(r.err)+'</div>';
  var m,rk=r.rank?(r.over?'50+':r.rank+'.'):'',tb=r.rank?'<br>Rekorlar tablosundaki sıran: <b>'+rk+'</b>':'';
  if(r.race){
    if(r.win&&r.celebrate&&r.rank===1)m=coin3d('🏆')+'<b>Tebrikler, yarışı kazandın ve oyundaki en yüksek puanı aldın!</b>';
    else if(r.win)m=coin3d('🏆')+'<b>Tebrikler, yarışı kazandın!</b>'+tb;
    else m='Puanın: <b>'+r.score+'</b>'+tb;
  }
  else if(r.celebrate&&r.rank===1)m=coin3d('👑')+'<b>Tebrikler, oyundaki en yüksek puanı aldınız!</b>';
  else m='Puanın: <b>'+r.score+'</b>'+tb;
  if(r.tb)return '<div class="pbox lbx">'+m+'<br><small>Tablo çalışması: rekorlar tablosuna yazılmaz.</small></div>';
  return '<div class="pbox lbx">'+m+'</div><button class="ghost" onclick="lbOpen(\''+r.kind+'\',\''+r.op+'\',\''+(r.lv||'k')+'\')">🏆 Rekorlar Tablosunu Gör</button>';
}
function lbShowBox(g){
  var e=document.getElementById('lb-box');
  if(e&&st.g===g)e.innerHTML=lbBoxHtml(g.lb);
}
function lbRun(g,kind,cand,nick){
  if(!nick||nick===GUESTN){if(kind==='race')g.lbP=Promise.resolve(null);else{g.lb={guest:true};lbShowBox(g)}return}
  if(kind==='race'){g.lbP=lbSubmit(kind,g.op,g.lv,g.score,cand,nick);return}
  g.lb={loading:true};lbShowBox(g);
  lbSubmit(kind,g.op,g.lv,g.score,cand,nick).then(function(res){
    if(res&&!res.err)res.score=g.score;
    g.lb=res||{score:g.score,kind:kind,op:g.op,lv:g.lv};lbShowBox(g);
    if(res&&res.celebrate&&res.rank===1){confetti(true);smpStop('win.mp3');smpPlay('top.mp3',0.9)}
  });
}
/* Sürüm 21-30 hatası: yarış puanı tabloya yazılmıyordu. Telefonda kayıtlı yarış rekorlarını bir kez tabloya gönder. */
function lbBackfill(){
  if(ls('mc_lbfix1',false)||!navigator.onLine)return;
  var b=ls('mc_rbest',{}),best={},p,mk,v,ks,ok=true,ch=Promise.resolve();
  for(p in b)for(mk in b[p]){v=b[p][mk];if(!(v>0)||/_t\d/.test(mk))continue;if(!best[mk]||v>best[mk].s)best[mk]={s:v,n:p}}
  ks=Object.keys(best);
  ks.forEach(function(k){var m=k.split('_'),lv=m[1]==='o'||m[1]==='z'?m[1]:'k';ch=ch.then(function(){return lbSubmit('race',m[0],lv,best[k].s,best[k].s,best[k].n)}).then(function(r){if(!r||r.err)ok=false})});
  ch.then(function(){if(ok)lsSet('mc_lbfix1',true)});
}
/* yarış bitince: sadece birinci olan tebrik + konfeti alır; sıra herkes bitince hesaplanır */
function raceFinal(g){
  var win=myRank()===1,op=g.op;
  g.lb={loading:true};lbShowBox(g);
  (g.lbP||Promise.resolve(null)).then(function(res){
    if(!res||res.err)return {race:true,win:win,score:g.score,kind:'race',op:op,lv:g.lv,tb:g.tb};
    return devAuth().then(function(fb){return lbTop(fb,lbCol('race',op,g.lv))}).then(function(rows){
      var r=lbRank(rows,res.best);
      return {race:true,win:win,score:g.score,rank:r.rank,over:r.over,celebrate:res.celebrate,kind:'race',op:op,lv:g.lv,tb:g.tb};
    });
  }).catch(function(){return {race:true,win:win,score:g.score,kind:'race',op:op,lv:g.lv,tb:g.tb}}).then(function(x){
    g.lb=x;lbShowBox(g);
    if(x.win&&g.score>0)confetti(true);
  });
}
function confetti(big){
  var c=document.createElement('canvas'),W=window.innerWidth,H=window.innerHeight,x,n=big?170:70,P=[],i,t0=Date.now(),cols=['#fde047','#2f6bff','#1f9d55','#d64545','#38bdf8','#fb923c'],dur=big?4500:2800;
  c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';
  c.width=W;c.height=H;x=c.getContext('2d');
  if(!x)return;
  document.body.appendChild(c);
  for(i=0;i<n;i++)P.push({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-0.5)*3,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-0.5)*0.3,c:cols[i%cols.length]});
  (function f(){
    var el=Date.now()-t0;
    x.clearRect(0,0,W,H);
    P.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);x.restore();
    });
    if(el<dur)requestAnimationFrame(f);else if(c.parentNode)c.parentNode.removeChild(c);
  })();
}

function lbLoad(){
  var body=document.getElementById('lb-body'),seq=++LBV.seq,kind=LBV.kind,op=LBV.op,lv=LBV.lv,col=lbCol(kind,op,lv),fb,rows;
  LBV.rows=null;LBV.mine=null;var sb=document.getElementById('lb-share');if(sb)sb.disabled=true;
  if(!body)return;
  if(!navigator.onLine){body.innerHTML='<p class="sub center">Rekorlar tablosu için internet gerekir.</p>';return}
  body.innerHTML='<p class="sub center">Yükleniyor…</p>';
  devAuth().then(function(f){fb=f;if(!CL.user)throw 0;return lbTop(fb,col)}).then(function(r){
    rows=r;
    var me=CL.user.uid,i;
    for(i=0;i<rows.length;i++){if(rows[i].uid===me)return rows[i].score}
    return fb.getDoc(fb.doc(CL.db,col,me)).then(function(s){return s.exists()?s.data().score:null});
  }).then(function(mine){
    if(seq!==LBV.seq||st.screen!=='lb')return;
    var me=CL.user.uid,h='',i,med=['🥇','🥈','🥉'],r,shown=false,title=LBV.kind==='race'?'Yarış Odası':'Akıldan İşlem';
    h+='<div class="tag">'+title+' · '+gLabel(op)+' · '+LVN[lv]+' · en yüksek puanlar</div>';
    if(!rows.length)h+='<p class="sub center">Henüz kimse yok. İlk rekoru sen kır!</p>';
    for(i=0;i<rows.length&&i<10;i++){
      r=rows[i];
      var tp=!!r.pid;
      h+='<div class="rrow'+(r.uid===me?' me':'')+(tp?' tap':'')+'"'+(tp?' onclick="lbTap('+i+')"':'')+'><span>'+(i<3?med[i]:(i+1)+'.')+' '+(r.rk!=null?rkMini(r.rk):'')+esc(r.nick)+(tp?' <small>›</small>':'')+'</span><b>'+r.score+'</b></div>';
      if(r.uid===me)shown=true;
    }
    if(!shown&&mine!==null){
      var rk=lbRank(rows,mine);
      h+='<div class="tag">…</div><div class="rrow me"><span>'+(rk.over?'50+':rk.rank+'.')+' Sen</span><b>'+mine+'</b></div>';
    }else if(mine===null&&rows.length)h+='<p class="sub center">Bu kategoride henüz rekorun yok.</p>';
    body.innerHTML=h;
    LBV.rows=rows;LBV.me=me;LBV.mine=mine===null?null:{score:mine,rank:lbRank(rows,mine),top:shown};
    var sb2=document.getElementById('lb-share');if(sb2)sb2.disabled=false;
  }).catch(function(){if(seq===LBV.seq&&body)body.innerHTML='<p class="sub center">Tablo yüklenemedi, tekrar dene.</p>'});
}

function rkNew(){return {p:0,hz:0,sw:[0,0,0],sh:[0,0,0],se:[0,0,0],sb:[0,0,0],mo:[0,0,0],tw:[0,0,0],dz:0,q:0,m:'0000000',r:0,dc:{d:'',o:{}},dd:'',dq:0,dk:'',ls:{},bf:0}}
function rkRaw(p){var a=ls('mc_rk',{}),x=a[p]||{},n=rkNew(),k;for(k in n)if(!(k in x))x[k]=n[k];return x}
function rkPut(p,x){var a=ls('mc_rk',{});a[p]=x;lsSet('mc_rk',a)}
function rkGet(p){var x=rkRaw(p);if(!x.bf){rkBackfill(p,x);rkPut(p,x)}return x}
function rkMine(){return st.profile?rkRaw(st.profile).r|0:0}
function rkDay(t){var d=t?new Date(t):new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function rkRank(x){for(var i=6;i>0;i--){if(x.p>=RKP[i]&&x.hz>=RKZ[i])return i}return 0}
function rkVal(x,fi,t){var k=RKF[fi].k;if(k==='se')return x.sb[t];if(k==='dz')return x.dz;if(k==='q')return x.q;return x[k][t]}
function rkHas(x,fi,t){return ((+x.m.charAt(fi)||0)>>t)&1}
function rkAddQ(x,n,t){if(!(n>0))return;var d=rkDay(t);x.q+=n;if(x.dd!==d){x.dd=d;x.dq=0}x.dq+=n;if(x.dq>=20&&x.dk!==d){x.dk=d;x.dz++}}
/* bir maçın sonucunu sayaçlara işle. mult: puan çarpanı (eski maçlar 0.5); cap: günlük rakip anahtarı */
function rkApply(x,e,mult,cap){
  var lv=e.tb?'k':(e.lv||'k'),L=lv==='z'?2:(lv==='o'?1:0),t;
  if(e.bot){if(e.won){var bi={y:0,c:1,d:2}[e.bot];if(bi!==undefined)x.mo[bi]++}return 'bot'}
  if(e.left&&(e.my|0)<Math.ceil((e.win||10)/2))return 'half';
  if(cap){var d=rkDay();if(x.dc.d!==d)x.dc={d:d,o:{}};var c=x.dc.o[cap]|0;if(c>=5)return 'cap';x.dc.o[cap]=c+1}
  var first=e.mm?e.rk===1:!!e.won,pts=0;
  if(e.mm){if(e.rk===1)pts=[2,4,6][L];else if(e.rk===2)pts=[1,2,3][L]}
  else if(e.won)pts=[1,2,3][L];
  x.p+=pts*mult;
  if(first){if(L===2)x.hz++;var a=e.mm?x.sh:x.sw;for(t=0;t<=L;t++){a[t]++;x.se[t]++;if(x.se[t]>x.sb[t])x.sb[t]=x.se[t]}}
  else x.se=[0,0,0];
  return 'ok';
}
/* yeni rütbe / madalya var mı: varsa kutlama sırasına ekle */
function rkCheck(x,bf){
  var r=rkRank(x),m='',out=[];
  RKF.forEach(function(F,fi){var b=0,t,ob=+x.m.charAt(fi)||0;for(t=0;t<3;t++)if(rkVal(x,fi,t)>=F.th[t])b|=1<<t;b|=ob;m+=b;for(t=0;t<3;t++)if((b>>t&1)&&!(ob>>t&1))out.push({t:'med',f:fi,g:t})});
  var up=r>x.r;if(r>x.r)x.r=r;x.m=m;
  if(bf){if(x.p>0||out.length||x.q>0)RK.q.push({t:'bf',r:x.r,p:x.p,meds:out,q:x.q})}
  else{if(up)RK.q.push({t:'rank',r:x.r});out.forEach(function(o){RK.q.push(o)})}
  return up||out.length>0;
}
/* ilk açılışta bu telefondaki eski oyunlar bir kez sayılır (kapışmalar yarım puanla) */
function rkBackfill(p,x){
  x.bf=1;
  var R=records().filter(function(r){return r&&r.p===p}).map(function(r){return {t:Date.parse(r.t)||r.id||0,ok:r.ok|0,id:r.id}}).sort(function(a,b){return a.t-b.t});
  R.forEach(function(r){rkAddQ(x,r.ok,r.t)});
  R.slice(-8).forEach(function(r){if(r.id)x.ls[r.id]=r.ok});
  var D=ls('mc_dhist',[]).filter(function(e){return e&&e.p===p}).sort(function(a,b){return a.t-b.t});
  D.forEach(function(e){rkApply(x,{bot:e.bot,won:!!e.w,mm:!!e.mm,rk:e.rk,lv:e.lv,tb:e.tb,win:e.win,left:!!e.left,my:e.a},0.5,null)});
  x.p=Math.floor(x.p);x.dc={d:'',o:{}};
  rkCheck(x,true);
}
/* canlı: oturumdaki doğru cevap sayısı (Pratik, Problemler, Akıldan İşlem, Yarış) */
function rkQ(sid,ok){
  if(!st.profile||!sid)return;
  var p=st.profile,x=rkGet(p),pv=x.ls[sid]||0;
  if(!(ok>pv))return;
  rkAddQ(x,ok-pv);x.ls[sid]=ok;
  var ks=Object.keys(x.ls);if(ks.length>8)ks.sort(function(a,b){return a-b}).slice(0,ks.length-8).forEach(function(k){delete x.ls[k]});
  var ch=rkCheck(x);rkPut(p,x);if(ch){rkPub();rkSoon()}
}
/* canlı: kapışma / muharebe / canavar maçı bitti */
function rkMatch(){
  if(!st.profile||!DU)return;
  var p=st.profile,x=rkGet(p),mm=DU.ids.length>2,cap=null;
  if(!DU.bot)cap=mm?'m:'+duOpps().map(function(u){return DU.pid[u]||DU.nick[u]}).sort().join(','):'o:'+(DU.opid||DU.onick);
  DU.rkRes=rkApply(x,{bot:DU.bot,won:!!DU.won,mm:mm,rk:DU.rank,lv:DU.qg.lv,tb:DU.qg.tb,win:DU.win,left:!!DU.left,my:DU.pts[DU.me]||0},1,cap);
  rkAddQ(x,DU.myR.filter(function(v){return v>0}).length);
  var ch=rkCheck(x);rkPut(p,x);bkSoon();rkPub();if(ch){rkSoon();rkLbSync(p)}
}

/* ---------- bildirimler (S49): Web Push, sunucu Cloudflare Worker (push.json: adres + VAPID açık anahtarı) ---------- */
var PUSH={cfg:null};
function pushOk(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function pushIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)&&!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))}
function pushCfg(){if(PUSH.cfg)return Promise.resolve(PUSH.cfg);return fetch('push.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.u&&j.k)PUSH.cfg=j;return PUSH.cfg}).catch(function(){return null})}
function pushKey(x){x=x.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';var r=atob(x),o=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function pushState(){if(!pushOk())return pushIOS()?'ios':'no';var p=Notification.permission;if(p==='denied')return 'denied';return p==='granted'&&ls('mc_push',{}).on?'on':'off'}
function pushSub(force){
  return pushCfg().then(function(c){
    if(!c)throw 'cfg';
    return navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sb){var m=ls('mc_push',{});if(sb&&m.k&&m.k!==c.k)return sb.unsubscribe().then(function(){return null});return sb})
      .then(function(sb){return sb||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKey(c.k)})})
      .then(function(sb){var j=sb.toJSON(),m=ls('mc_push',{});m.on=1;m.k=c.k;lsSet('mc_push',m);return pushSave(j,force)});
    });
  });
}
function pushSave(j,force){
  if(!FR.pid||!j||!j.keys)return;
  var pid=FR.pid,sig=j.endpoint.slice(-32),m=ls('mc_push',{});if(!force&&m.w&&m.w[pid]===sig)return;
  return devAuth().then(function(fb){return fb.setDoc(fb.doc(CL.db,'ps',pid),{e:j.endpoint,k:j.keys.p256dh,a:j.keys.auth,ts:Date.now()})}).then(function(){var m2=ls('mc_push',{});m2.w=m2.w||{};m2.w[pid]=sig;lsSet('mc_push',m2)});
}
function pushOn(){
  if(!pushOk()){toast(pushIOS()?'Önce uygulamayı ana ekrana ekle':'Bu tarayıcı bildirimleri desteklemiyor');return}
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){toast('Bildirim izni verilmedi');if(st.screen==='friends')render();return}
    return pushSub(true).then(function(){toast('🔔 Bildirimler açıldı');if(st.screen==='friends')render()});
  }).catch(function(){toast('Bildirimler açılamadı, internetini kontrol et')});
}
function pushSync(){if(pushState()==='on'&&FR.pid)pushSub(false).catch(function(){})}
function pushSend(to,k,x){
  if(!FR.pid||!CL.user||!to)return;
  var from=FR.pid;
  pushCfg().then(function(c){if(!c)return;return CL.user.getIdToken().then(function(t){return fetch(c.u+'/push',{method:'POST',body:JSON.stringify(Object.assign({t:t,k:k,from:from,to:to},x||{}))})})}).catch(function(){});
}
function pushBox(){

  if(s==='on')return '<div class="pbox pushb">🔔 <b>Bildirimler açık.</b><br><small>Uygulama kapalıyken de arkadaşların seni çağırınca haber gelir.</small></div>';

}

b> düğmesine bas, izin ver. Uygulama kapalıyken bir arkadaşın seni kapışmaya ya da muharebeye çağırınca, ya da arkadaşlık isteği gönderince telefonuna bildirim gelir. Bildirime dokununca uygulama açılır ve <b>doğrudan kapışmaya girersin</b>. iPhone’da önce uygulamayı <b>ana ekrana eklemen</b> gerekir.</li><li>Arkadaşlıkların otomatik yedeğe dahildir. Telefon değişirse yedek koduyla geri gelir.</li></ul>'},
 {id:'duel',t:'⚔️ 1’e 1 Kapışma',h:'<ul><li>Yarış Odası → <b>1’e 1 Kapışma Kur</b>.</li><li>Seviyeyi, maçın kaç puanda biteceğini (<b>10, 15 ya da 20</b>) ve işlemi seç. Çarpma ve bölmede istersen 📚 Tablo çalış.</li><li>Davet linkini ya da kodu arkadaşına gönder. O girince kapışma kendiliğinden başlar.</li><li>Her soruda <b>önce doğru basan</b> 1 puan alır. Yanlış basan o soruda kilitlenir.</li><li>Hız her telefonda ayrı ölçülür. İnterneti yavaş olan haksızlığa uğramaz.</li><li>Her soru için süre: Kolay ve tablo 10, Orta 12, Zor 15 saniye.</li><li>Seçilen puana ilk ulaşan kazanır. Bitince <b>Rövanş</b> ile hemen tekrar oynayabilirsiniz.</li><li>Kapışmadan çıkan yenilmiş sayılır.</li><li><b>Tek başına oynamak için:</b> Yarış Odası → <b>👾 Canavara Karşı Savaş</b>. 🐣 Yavru Canavar (kolay sayılar), 👾 Canavar (orta sayılar) ya da 🐉 Dev Canavar (zor sayılar) seç, sonra işlemi seç. İnternet gerekmez.</li><li>Sonuçların <b>Yarış Geçmişim → Kapışmalarım</b> bölümünde görünür. İnternet gerekir.</li></ul>'},
 {id:'mm',t:'🛡️ Meydan Muharebesi',h:'<ul><li>Yarış Odası → <b>Meydan Muharebesi Kur</b>. 3 ya da 4 kişi oynar.</li><li>Seviyeyi, maç puanını (10, 15, 20) ve işlemi seç. Kodu ya da davet linkini gönder; lobide <b>📨 Çağır</b> ile arkadaşlarını da çağırabilirsin.</li><li>En az 3 kişi olunca kurucu <b>Muharebeyi Başlat</b>a basar. Başlayınca yeni kişi giremez.</li><li>Kural 1’e 1 Kapışma ile aynı: her soruda <b>önce doğru basan</b> 1 puan alır, yanlış basan o soruda kilitlenir.</li><li>Seçilen puana ilk ulaşan kazanır. Sonuçta 🥇🥈🥉 sıralaması çıkar.</li><li>Biri ayrılırsa muharebe kalanlarla sürer. Herkes <b>Rövanş</b>a basınca yeniden başlar.</li></ul>'},
 {id:'team',t:'👥 Takımlar ve Takım Kapışması',h:'<ul><li>Ana menü → <b>👥 Takımım</b>. Profil ile girmen ve internet gerekir.</li><li><b>Takım kur:</b> listeden bir takım adı seç (örn. 🦅 Kartallar). Her ad tek bir takımındır. Takımı kuran ilk kaptandır.</li><li>Takımlar <b>en çok 4 kişi</b>dir. Her öğrencinin tek takımı olur. <b>📨 Çağır</b> ile arkadaşlarını takıma davet et; kabul edince takıma girerler. İstediğin zaman <b>🚪 Takımdan ayrıl</b>abilirsin. Kimse seni takımdan çıkaramaz.</li><li><b>👑 Kaptanlık Maçı:</b> takımda en az 2 kişi olunca yapılır (2 kişi 1’e 1, 3-4 kişi Meydan Muharebesi). Kazanan kaptan olur. Haftada bir yapılabilir; yeni biri takıma katılınca beklemeden yapılabilir. Rütbe puanı vermez.</li><li><b>⚔️ Takım Kapışması:</b> rakip takımı seç, soru sayısını (10, 15, 20), seviyeyi ve işlemi seç. İki takıma da davet gider.</li><li>Her takımdan <b>en az 2 kişi</b> gelince başlatılır. Bir takım eksikse <b>👾 Takım Canavarı</b> tamamlar; ama canavar sayısı oyuncu sayısını geçemez.</li><li>Oyun başlayınca herkes karşı takımda <b>rütbesine yakın biriyle</b> eşleşir. Her çift kendi arasında 1’e 1 kapışır: önce doğru basan puanı alır. Bütün çiftlerin puanları takıma eklenir; üstte takım skoru görünür.</li><li>Sonuçta kazanan takım, çiftlerin skorları ve <b>⭐ Takımın yıldızı</b> (takımına en çok puan getiren) görünür.</li><li><b>Rütbe puanı:</b> çiftini kazanırsan 1’e 1 gibi puan alırsın (Kolay 1, Orta 2, Zor 3). Takımın kazanırsa takımdaki herkese ayrıca +1 / +2 / +3. Canavarla kapışan çift puan almaz ama puanı takıma sayılır.</li><li><b>🤝 Takım Oyuncusu madalyası:</b> 5 / 15 / 30 takım galibiyeti.</li><li><b>👾 Canavar Takımına Karşı:</b> rakip takım yoksa takımın canavarlara karşı oynar. Alıştırmadır, rütbe puanı vermez.</li></ul>'},
 {id:'rv',t:'⏰ Zamanlı Oyun',h:'<ul><li>Arkadaşınla şimdi değil de <b>biraz sonra</b> oynamak istiyorsan: Yarış Odası → <b>⏰ Zamanlı Oyun Kur</b>.</li><li><b>Ne zaman?</b> 15, 30, 45 ya da 60 dakika sonrasını seç. Saat de yazar.</li><li><b>1’e 1:</b> bir arkadaşını seç. <b>Meydan Muharebesi:</b> 3 ya da 4 arkadaşını seç; 3 kişi gelirse muharebe başlar.</li><li>Seviyeyi, maç puanını ve işlemi seç, <b>📨 Randevu isteği gönder</b>e dokun.</li><li>Arkadaşına istek gider: <b>✅ Olur</b> ya da <b>Gelemem</b> der. Cevabı sana haber verilir.</li><li>Ana menünün üstünde yaklaşan oyunların ve kalan süre görünür.</li><li>Saatinden <b>10 dakika önce</b> <b>▶️ Gir</b>e dokun. Saat gelince oyun kendiliğinden başlar.</li><li>Bildirimleri açtıysan <b>5 dakika kala</b> telefonuna haber gelir.</li><li>Kurduğun oyunu <b>🗑 İptal et</b>ebilirsin; arkadaşlarına haber gider.</li><li>Biri seni şimdi çağırdığında <b>🕐 Daha sonra oynayalım</b>a dokunursan bu ekran açılır; rakip ve ayarlar hazır gelir, sadece zamanı seçersin.</li></ul>'},
 {id:'race',t:'🏁 Yarış Odası',h:'<p><b>Oda kurmak için:</b></p><ul><li>Yarış Odası → Oyun Odası Kur.</li><li>İstersen bir <b>oda kodu</b> yaz (3-10 harf ya da rakam). Yazmazsan kod kendiliğinden verilir.</li><li>Seviyeyi (Kolay, Orta, Zor) seç.</li><li>Sonra işlemi seç. Oda açılır. Çarpma ya da bölmeyi seçersen önce sorulur: <b>seviyeye göre</b> mi, yoksa tek bir tabloyla mı (<b>📚 Tablo çalış</b>)?</li><li>Odada çıkan <b>davet linkini</b> kopyalayıp ya da paylaşıp arkadaşlarına gönder.</li><li>Herkes gelince <b>Yarışı Başlat</b> düğmesine bas. Başlayınca yeni kişi giremez.</li></ul><p><b>Odaya girmek için:</b></p><ul><li>Gönderilen linke dokun, <b>kim olarak</b> gireceğini seç (profilin ya da misafir).</li><li>Ya da Yarış Odası → oda kodunu yaz → Odaya Gir.</li></ul><p><b>Yarışta:</b></p><ul><li>5 saniye sayılır, zirve kartı çıkar ve düdükle yarış başlar. Herkes <b>aynı sorularla</b> başlar.</li><li>Herkesin 3 canı var. Canı biten yarıştan çıkar ve diğerlerini bekler.</li><li>Sıralamayı canlı görürsün. İnterneti kopan oyuncunun yanında <b>📶 bağlantısı koptu</b> yazar; 45 saniye dönmezse yarış onu beklemeden biter.</li><li>Herkes bitince sonuç çıkar. Birinci olan tebrik alır. Sonuç kartının fotoğrafını kaydedebilirsin.</li><li>Yarış bitmeden çıkış kilitlidir.</li></ul><p>İnternet gerekir.</p>'},
 {id:'rank',t:'🏅 Rütbe ve madalyalar',h:'<ul><li>Profille oynarsan <b>rütbe</b> ve <b>madalya</b> kazanırsın. Ana menü → <b>🪪 Karakter Kartım</b>: rozetin, madalyaların ve istatistiklerin burada. <b>📤 Kartımı Paylaş</b> ile kartının fotoğrafını gönderebilirsin.</li><li>Rekorlar tablosunda ya da Arkadaşlarım listesinde birine dokununca <b>onun karakter kartı</b> açılır.</li><li><b>Puan:</b> 1’e 1 kapışma kazanınca Kolay 1, Orta 2, Zor 3 puan. Meydan Muharebesinde birinciye iki katı, ikinciye bir katı puan. Kaybedince puan gitmez.</li><li><b>Rütbeler:</b> Çaylak (0) → Çırak (15) → Savaşçı (60) → Şövalye (150) → Usta (300 + 25 Zor galibiyet) → Şampiyon (600 + 50 Zor galibiyet) → Efsane (1000 + 100 Zor galibiyet). Rütbe hiç düşmez.</li><li><b>Madalyalar:</b> Kılıç, Kalkan, Seri, Canavar Avcısı, Azim ve Soru Ustası. Bronz her seviyede, gümüş Orta ya da Zor, altın sadece Zor seviyede kazanılır.</li><li>Aynı rakiple günde ilk 5 maç sayılır. Rakip maçın yarısı oynanmadan çıkarsa maç sayılmaz. Canavar maçları rütbe puanı vermez.</li><li>Yeni bir şey kazanınca oyun sonunda kutlama penceresi çıkar. <b>📤 Paylaş</b> ile fotoğrafını gönderebilirsin.</li><li>Rütben ve madalyaların herkese görünür: rekorlar tablosunda, arkadaş profilinde ve kapışma girişinde.</li><li>İlk açılışta bu telefondaki eski oyunların bir kez sayılır (eski kapışmalar yarım puanla).</li><li>Ayrıntı: Karakter Kartım → <b>❓ Nasıl kazanırım?</b></li></ul>'},
 {id:'lb',t:'🏆 Rekorlar Tablosu',h:'<ul><li>Ana menüdeki <b>Rekorlar Tablosu</b>ndan açılır. İnternet gerekir.</li><li>İki sekme var: <b>Akıldan İşlem</b> ve <b>Yarış Odası</b>. İşlem türünü ve seviyeyi (Kolay, Orta, Zor) seçersin. Her seviyenin tablosu ayrıdır.</li><li><b>Tabloyu Paylaş</b> düğmesiyle tablonun fotoğrafını kaydedip gönderebilirsin.</li><li>En yüksek 10 kişi görünür. İlk 10 içinde değilsen kendi sıran altta yazar.</li><li>Her kişinin her işlemde tek satırı vardır. Sadece rekor kırınca yükselir.</li><li>Birinci olursan tebrik ve konfeti çıkar 🎉</li><li>Tabloda <b>oyun adın</b> herkese görünür (örn. 🦊 Kurnaz Tilki).</li><li>Tablodaki birine dokununca <b>karakter kartı</b> açılır: rozeti, madalyaları ve istatistikleri. Oradan <b>➕ Arkadaşlık isteği</b> gönderebilirsin.</li></ul>'},
 {id:'score',t:'📊 Skorlarım ve skor kartı',h:'<ul><li>Profille oynarsan <b>Skorlarım</b> bölümünde son 14 günün skorlarını görürsün.</li><li>Her oturumun sonunda bir <b>skor kartı</b> çıkar.</li><li><b>Fotoğrafı Kaydet / Paylaş</b> ile kartı kaydedip WhatsApp ile öğretmenine gönderebilirsin.</li></ul>'},
 {id:'faq',t:'❓ Sorun çözümü',h:'<ul><li><b>Skorlarım kayboldu / telefon değişti:</b> Uygulamayı aç → <b>Haydi Başlayalım</b> → <b>🔑 Hesabım var</b> → hesap kodunu yaz. Kodun eski cihazında <b>👤 Hesabım</b> sayfasında yazar.</li><li><b>Sesli okuma çalışmıyor:</b> Telefonda Türkçe ses yüklü olmalı (telefon ayarları → Metin okuma). Telefonun sesini aç.</li><li><b>Yarışa giremiyorum:</b> İnternetin açık olduğundan, kodu doğru yazdığından ve yarışın başlamadığından emin ol. Oda kodu 24 saat geçerlidir.</li><li><b>"Farklı sürüm" uyarısı:</b> Uygulamayı tamamen kapatıp yeniden aç. Güncellenir.</li><li><b>Rekorlar Tablosu açılmıyor:</b> İnternetini kontrol et, biraz sonra tekrar dene.</li><li><b>Uygulamayı ana ekrana eklemek:</b> Tarayıcı menüsünden "Ana ekrana ekle"ye dokun.</li></ul>'}
];

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r,fill){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=fill;c.fill()}

/* telefonun geri tuşu = uygulamadaki ← ; karşılama ekranında çıkış sorusu.
   Chrome, dokunuş olmadan eklenen geçmiş kayıtlarını geri tuşunda atlar. Bu yüzden
   kayıtlar sadece dokunuş (click) anında eklenir ve 10 kayıtlık tampon tutulur. */
var NAV={d:0,ex:false,skip:false,max:10};
function navFill(){
  if(NAV.ex)return;
  try{while(NAV.d<NAV.max){history.pushState({mc:1},'');NAV.d++}}catch(e){}
}
function navInit(){
  if(!window.history||!history.pushState)return;
  document.addEventListener('click',navFill,true);
  /* çıkış sırasında kullanıcı yeniden dokunursa uygulamada kalmak istiyordur */
  document.addEventListener('pointerdown',function(){if(NAV.ex){NAV.ex=false;if(NAV.tt){clearTimeout(NAV.tt);NAV.tt=null}}},true);
  window.addEventListener('popstate',function(){
    /* çıkış onaylandı: uygulamanın tüm geri adımlarını (önceki oturumlardan kalanlar dahil) sarmaya devam et */
    if(NAV.ex){try{history.back()}catch(e){}return}
    if(NAV.d>0)NAV.d--;
    if(st.modal){var n=document.getElementById('mn');if(n)n.click();return}
    if(st.screen==='welcome'){askExit();return}
    back();
  });
}
function askExit(){modal('Uygulamadan çıkmak istiyor musun?','Evet, çık','Hayır, kal',appExit,null)}
function appExit(){
  NAV.ex=true;NAV.d=0;
  try{window.close()}catch(e){}
  try{history.back()}catch(e){}
  /* en baştaki sayfaya gelinip hâlâ buradaysak: son bir geri basışı uygulamayı kapatır */
  if(NAV.tt)clearTimeout(NAV.tt);
  NAV.tt=setTimeout(function(){NAV.tt=null;if(NAV.ex)toast('Çıkmak için telefonun geri tuşuna bir kez daha bas')},1200);
}

function answer(v,el){

    msg.style.color='var(--bad)';msg.textContent='Yanlış. Tekrar dene! (Bu denemede puan yok)';

function resolve(r,msg){

  else{st.bad++;st.streak=0;msg.style.color='var(--bad)';msg.textContent='Yanlış. Çözümü görmek için butona bas.'}
  if(r===1)sndOk(2);else if(r===2)sndOk(1);else sndBad();
  document.getElementById('p-sc').textContent=st.score;
  document.getElementById('p-ok').textContent=st.ok;

  sv.style.color=(saved||st.profile===null)?'var(--muted)':'var(--bad)';
}
var BNAME=['birler','onlar','yüzler','binler','on binler','yüz binler'];
function BN(i){return BNAME[i]||(i+'. basamak')}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function digs(n){return String(n).split('').map(Number)}
function cp(o){var r={};for(var k in o)r[k]=o[k].slice();return r}
function stepsAdd(a,b,ans){
  var A=digs(a).reverse(),B=digs(b).reverse(),N=String(ans).length,L=Math.max(A.length,B.length),list=[],carry=0,wr=[],an={},i;
  for(i=0;i<L;i++){
    var da=A[i]||0,db=B[i]||0,sm=da+db+carry,w=sm%10,nc=sm>=10?1:0,t;
    if(carry)an[i]=['+1'];
    t=BN(i)+' basamağı: '+da+' + '+db+(carry?' + 1 (elde)':'')+' = '+sm+'. ';
    t+=nc?(w+' yaz, 1 elde olarak '+BN(i+1)+' basamağına ekle.'):(sm+' yaz.');
    wr[i]=w;list.push({t:cap(t),hl:i,wr:wr.slice(),an:cp(an)});
    carry=nc;
  }
  if(carry){wr[N-1]=1;list.push({t:'Son eldeyi (1) '+BN(N-1)+' basamağına yaz.',hl:N-1,wr:wr.slice(),an:cp(an)})}
  return {kind:'tbl',N:N,a:a,b:b,sym:'+',list:list};
}
function stepsSub(a,b,ans){
  var A=digs(a).reverse(),B=digs(b).reverse(),N=A.length,list=[],lent=0,wr=[],an={},i;
  for(i=0;i<N;i++){
    var da=A[i],db=B[i]||0,cur=da-lent,bor=cur<db,r=(bor?cur+10:cur)-db,t='';
    if(lent){t+=BN(i)+' basamağından 1 verilmişti: '+da+' − 1 = '+cur+'. '}else{t+=BN(i)+' basamağı: '}
    if(bor){
      t+=cur+' sayısı, '+db+' sayısından küçük. '+cap(BN(i+1))+' basamağından 1 onluk alırız: '+(cur+10)+' − '+db+' = '+r+'.';
      an[i]=(an[i]||[]).concat(['+10']);an[i+1]=(an[i+1]||[]).concat(['−1']);
    }else{t+=cur+' − '+db+' = '+r+'.'}
    wr[i]=r;list.push({t:cap(t),hl:i,wr:wr.slice(),an:cp(an)});
    lent=bor?1:0;
  }
  return {kind:'tbl',N:N,a:a,b:b,sym:'−',list:list};
}
function stepsMul(a,b,ans){
  var A=digs(a).reverse(),N=String(ans).length,list=[],carry=0,wr=[],an={},i;
  for(i=0;i<A.length;i++){
    var x=A[i]*b,p=x+carry,w=p%10,nc=Math.floor(p/10),t;
    if(carry)an[i]=['+'+carry];
    t=BN(i)+' basamağı: '+A[i]+' × '+b+' = '+x+'. '+(carry?x+' + '+carry+' (elde) = '+p+'. ':'');
    t+=nc?(w+' yaz, '+nc+' elde olarak '+BN(i+1)+' basamağına ekle.'):(p+' yaz.');
    wr[i]=w;list.push({t:cap(t),hl:i,wr:wr.slice(),an:cp(an)});
    carry=nc;
  }
  if(carry){wr[N-1]=carry;list.push({t:'Son eldeyi ('+carry+') '+BN(N-1)+' basamağına yaz.',hl:N-1,wr:wr.slice(),an:cp(an)})}
  return {kind:'tbl',N:N,a:a,b:b,sym:'×',hlb:true,list:list};
}
function stepsDiv(a,b,ans){
  var D=digs(a),pos=0,cur=D[0],q='',list=[],first=true,prevRem=0;
  while(cur<b&&pos<D.length-1){pos++;cur=cur*10+D[pos]}
  for(;;){
    var qd=Math.floor(cur/b),prod=qd*b,rem=cur-prod,t;
    if(first){t=(pos>0?'İlk '+(pos+1)+' basamağı alırız: '+cur+'. ':'')}
    else{t='Kalan '+prevRem+'. Yanına '+D[pos]+' indir: '+cur+'. '}
    t+=cur+' sayısında '+b+' kaç kere var? '+qd+' kere. '+qd+' × '+b+' = '+prod+'. '+cur+' − '+prod+' = '+rem+'.';
    q+=qd;list.push({t:t,pos:pos,q:q});
    if(pos>=D.length-1)break;
    prevRem=rem;pos++;cur=rem*10+D[pos];first=false;
  }
  return {kind:'div',a:a,b:b,list:list};
}
function buildSteps(q){
  if(q.sym==='+')return stepsAdd(q.a,q.b,q.ans);
  if(q.sym==='−')return stepsSub(q.a,q.b,q.ans);
  if(q.sym==='×')return stepsMul(q.a,q.b,q.ans);
  return stepsDiv(q.a,q.b,q.ans);
}
function tblHtml(S,stp){
  var N=S.N,A=digs(S.a).reverse(),B=digs(S.b).reverse(),resLen=String(S.sym==='+'||S.sym==='×'?S.a*(S.sym==='×'?S.b:1)+(S.sym==='+'?S.b:0):S.a-S.b).length,c,r0='<td></td>',r1='<td></td>',r2='<td class="op">'+S.sym+'</td>',r4='<td></td>';
  for(c=N-1;c>=0;c--){
    var h=stp.hl===c?' hl':'',a=stp.an[c]?stp.an[c].join('<br>'):'';
    r0+='<td class="an">'+a+'</td>';
    r1+='<td class="'+h.trim()+'">'+(A[c]!==undefined?A[c]:'')+'</td>';
    r2+='<td class="'+((S.hlb&&c===0)||h?'hl':'')+'">'+(B[c]!==undefined?B[c]:'')+'</td>';
    var w=stp.wr[c];
    r4+='<td class="'+h.trim()+'">'+(w===undefined?'':(c>=resLen?'<span class="lz">'+w+'</span>':w))+'</td>';
  }
  return '<table class="st"><tr>'+r0+'</tr><tr>'+r1+'</tr><tr>'+r2+'</tr><tr><td class="bar" colspan="'+(N+1)+'"></td></tr><tr>'+r4+'</tr></table>';
}
function divStepHtml(S,stp){
  var d=String(S.a),k=stp.pos+1;
  return '<div style="text-align:center"><div class="vdiv"><div class="dd"><span class="hl">'+d.slice(0,k)+'</span>'+d.slice(k)+'</div><div class="dv"><div class="dt">'+S.b+'</div><div class="qq">'+stp.q+'</div></div></div></div>';
}
function renderSteps(){
  var S=st.steps,k=st.sk,n=S.list.length,stp=S.list[k-1];
  var multi=st.q.stages&&st.q.stages.length>1,pre=multi?(st.pst+1)+'. işlem · '+cap(SYMN[st.q.stages[st.pst].sym])+' · ':'';
  var h='<div class="tag">'+pre+'Adım '+k+' / '+n+'</div>'+(S.kind==='div'?divStepHtml(S,stp):tblHtml(S,stp))+'<div class="stext">'+stp.t+'</div>';
  if(k<n)h+='<button class="next" onclick="nextStep()">Sonraki adım →</button>';
  document.getElementById('steps').innerHTML=h;
  if(k===n){
    if(st.q.stages&&st.pst<st.q.stages.length-1){
      document.getElementById('steps').insertAdjacentHTML('beforeend','<div class="pbox"><b>Ara sonuç: <span class="sol">'+st.q.stages[st.pst].ans+'</span></b></div><button class="next" onclick="nextStage()">Sıradaki işleme geç →</button>');
    }else finishSol();
  }
}
function startStage(){var g=st.q.stages[st.pst];st.steps=buildSteps({sym:g.sym,a:g.a,b:g.b,ans:g.ans});st.sk=1;renderSteps()}
function nextStage(){st.pst++;startStage()}
function probIntro(){
  var q=st.q,h='<div class="pbox"><h3>📝 Problem çözme adımları</h3><p><b>1. Verilenler</b></p><ul>';
  q.given.forEach(function(g){h+='<li>'+g+'</li>'});
  h+='</ul><p><b>2. Ne isteniyor?</b></p><div>'+q.ask+'</div><p><b>3. Hangi işlemi yapacağız?</b></p><div>'+q.hint+'</div>';
  if(q.stages.length>1){
    h+='<p><b>4. İşlem sırası</b></p><ol>';
    q.stages.forEach(function(g,i){h+='<li>'+(i===0?'Önce ':'Sonra ')+SYMN[g.sym]+': '+(i===0?g.a+' '+g.sym+' '+g.b:'ara sonuç '+g.sym+' '+g.b)+'</li>'});
    h+='</ol>';
  }
  h+='</div><button class="next" onclick="startStage()">'+(q.stages.length>1?'İlk işlemi çözelim →':'İşlemi çözelim →')+'</button>';
  document.getElementById('steps').innerHTML=h;
}
function nextStep(){st.sk++;renderSteps()}
function finishSol(){
  st.showSol=true;
  document.getElementById('qbox').innerHTML=qHtml(st.q,true);
  var msg=document.getElementById('msg');msg.style.color='var(--ok)';msg.textContent='Doğru cevap: '+st.q.ans;
  document.getElementById('next').hidden=false;
}
function showSol(){
  document.getElementById('sol').hidden=true;
  document.getElementById('opts').style.display='none';
  document.getElementById('msg').textContent='';
  if(st.q.stages){st.pst=0;probIntro();return}
  st.steps=buildSteps(st.q);st.sk=1;
  renderSteps();
}
function nextQ(){st.idx++;newQ();render()}
function saveProgress(){
  if(st.profile===null)return true;
  var l=records(),i,r={id:st.sid,p:st.profile,t:st.t,op:st.op,e:st.eldeli,d:st.d,s:st.score,ok:st.ok,bad:st.bad,fix:st.fix,qs:st.log,br:st.breakUsed?1:0,k:st.kind==='p'?'p':undefined,m:st.op==='mix'?st.mix:undefined};
  for(i=l.length-1;i>=0;i--){if(l[i].id===st.sid){l[i]=r;break}}
  if(i<0)l.push(r);
  var done=lsSet('mc_records',recTrim(l));
  if(!done)toast('Skor kaydedilemedi: tarayıcı depolaması kapalı olabilir');
  else cloudQueue();
  try{rkQ(st.sid,st.ok|0)}catch(e){}
  return done;
}
function finish(){
  st.last={score:st.score,ok:st.ok,bad:st.bad,fix:st.fix,label:catLabel(st.op,st.eldeli,st.d,st.kind,st.mix)};
  go('summary');
}

if('serviceWorker' in navigator){window.addEventListener('load',function(){try{
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!had){had=true;return}
    PENDRELOAD=true;
    if(['welcome','profiles','home'].indexOf(st.screen)>=0&&!st.modal)location.reload();
    else toast('Yeni sürüm hazır. Ana menüye dönünce yenilenecek');
  });
  navigator.serviceWorker.register('sw.js').catch(function(){});
}catch(e){}})}
st.vert=ls('mc_vert',false);
render();
if(DEEP)setTimeout(deepRun,400);
if(HSP)setTimeout(function(){acLinkStart(HSP)},500);
navInit();
setTimeout(lbBackfill,3000);
setTimeout(nmSync,1500);
window.addEventListener('online',function(){setTimeout(nmSync,1000)});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}
setTimeout(function(){acPull(true)},2000);
setTimeout(function(){bkRun()},6000);
setTimeout(lbFixOnce,9000);
window.addEventListener('online',function(){setTimeout(function(){acPull(true)},1500)});
document.addEventListener('visibilitychange',function(){if(document.hidden&&BK.t){clearTimeout(BK.t);BK.t=null;bkRun()}if(!document.hidden){frBeat();setTimeout(acPull,800)}});
</script>
